<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1030" font-family="'Noto Sans JP','Segoe UI',Roboto,sans-serif">
  <!-- ===== 更新方法: 各カードの<text>行を編集すれば内容を更新できます ===== -->
  <rect x="0" y="0" width="1300" height="1030" fill="#f8fafc"/>

  <!-- Header -->
  <rect x="0" y="0" width="1300" height="66" fill="#0f172a"/>
  <text x="36" y="42" fill="#ffffff" font-size="26" font-weight="800">🍶 izakanpai POS システム利用イメージ</text>
  <text x="1264" y="28" fill="#93c5fd" font-size="13" text-anchor="end">飲食店運営オールインワン POS</text>
  <text x="1264" y="48" fill="#cbd5e1" font-size="12" text-anchor="end">iOS・Android・Web / Cloudflare</text>

  <!-- Arrows (背面に描画) -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <symbol id="phoneIcon" viewBox="0 0 40 74">
      <rect x="2" y="2" width="36" height="70" rx="8" fill="#0f172a"/>
      <rect x="6" y="10" width="28" height="50" rx="2" fill="#e2e8f0"/>
      <circle cx="20" cy="66" r="3" fill="#64748b"/>
    </symbol>
  </defs>
  <g stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="400" y1="205" x2="486" y2="258"/>            <!-- 客→hub -->
    <line x1="900" y1="205" x2="814" y2="258"/>            <!-- 厨房→hub -->
    <line x1="230" y1="470" x2="560" y2="352"/>            <!-- ホール→hub -->
    <line x1="1070" y1="430" x2="742" y2="352"/>           <!-- 管理→hub -->
    <line x1="650" y1="352" x2="650" y2="432"/>            <!-- hub→データ -->
    <line x1="650" y1="530" x2="650" y2="876"/>            <!-- データ→外部連携 -->
  </g>
  <g font-size="12.5" fill="#475569" font-weight="700">
    <text x="415" y="238">① 注文</text>
    <text x="836" y="238" text-anchor="end">② 連携</text>
    <text x="392" y="410">注文入力・会計</text>
    <text x="906" y="392" text-anchor="end">管理・集計</text>
    <text x="662" y="400">保存</text>
  </g>

  <!-- 中央: システム hub -->
  <rect x="486" y="212" width="328" height="140" rx="14" fill="#0f172a" stroke="#0ea5e9" stroke-width="2.5"/>
  <text x="650" y="250" fill="#ffffff" font-size="18" font-weight="800" text-anchor="middle">🖥️ izakanpai POS</text>
  <text x="650" y="280" fill="#e2e8f0" font-size="12.5" text-anchor="middle">iOS / Androidアプリ + Web/PWA</text>
  <text x="650" y="302" fill="#e2e8f0" font-size="12.5" text-anchor="middle">役割別権限・JP/EN・安全なログイン</text>
  <text x="650" y="330" fill="#7dd3fc" font-size="12.5" text-anchor="middle">注文・会計・在庫・スタッフ・顧客管理</text>

  <!-- データ基盤 -->
  <rect x="486" y="432" width="328" height="96" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="650" y="462" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">🗄️ クラウド基盤</text>
  <text x="650" y="486" fill="#334155" font-size="12.5" text-anchor="middle">Cloudflare D1（業務データ）</text>
  <text x="650" y="508" fill="#334155" font-size="12.5" text-anchor="middle">Workers API / Scheduler + R2（画像・証跡）</text>

  <!-- ================= 客 ================= -->
  <rect x="40" y="88" width="360" height="250" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="60" y="120" fill="#1d4ed8" font-size="17" font-weight="800">👤 客（お客様のスマホ）</text>
  <g font-size="12.8" fill="#1e293b">
    <text x="60" y="150">📱 QRコードから注文画面にアクセス</text>
    <text x="60" y="174">🍽️ メニュー注文（写真・オプション・数量）</text>
    <text x="60" y="198">🎟️ クーポン／🎁 会員ポイント利用</text>
    <text x="60" y="222">💳 QR・カード決済／🧾 eレシート（任意）</text>
    <text x="60" y="246">🔔 スタッフ呼出／お会計依頼／📋 注文状況</text>
    <text x="60" y="270">⭐ フィードバック／🎂 誕生日登録</text>
    <text x="60" y="294">🥡 テイクアウト注文／🗓️ 予約</text>
    <text x="60" y="320" fill="#64748b" font-size="11.5">※ ログイン不要・卓ごとにQR</text>
  </g>
  <g transform="translate(400,105)">
    <circle r="30" fill="#ffffff" stroke="#3b82f6" stroke-width="3"/>
    <use href="#phoneIcon" x="-14" y="-26" width="28" height="52"/>
  </g>
  <text x="400" y="146" fill="#1d4ed8" font-size="10.5" font-weight="800" text-anchor="middle">客のスマホ</text>

  <!-- ================= 厨房 ================= -->
  <rect x="900" y="88" width="360" height="250" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="920" y="120" fill="#c2410c" font-size="17" font-weight="800">🍳 厨房（キッチン端末）</text>
  <g font-size="12.8" fill="#1e293b">
    <text x="920" y="150">① 🖥️ KDSに客の注文が一覧表示（自動更新）</text>
    <text x="920" y="174">② 🖨️ 注文をプリンタへ自動印刷（カテゴリ別）</text>
    <text x="920" y="198">③ 🍳 表示・注文票を見てフードを調理</text>
    <text x="920" y="222">④ ✅ できたら「提供済」に設定→一覧から消える</text>
    <text x="920" y="246">📦 提供時に材料在庫を自動で減算</text>
    <text x="920" y="272" fill="#64748b" font-size="11.5">※ 商品ごとに厨房表示ON/OFFを設定可能</text>
  </g>
  <g transform="translate(1260,105)">
    <circle r="30" fill="#ffffff" stroke="#f97316" stroke-width="3"/>
    <use href="#phoneIcon" x="-14" y="-26" width="28" height="52"/>
  </g>
  <text x="1260" y="146" fill="#c2410c" font-size="10.5" font-weight="800" text-anchor="middle">厨房用端末</text>

  <!-- ================= ホール・店員 ================= -->
  <rect x="40" y="470" width="360" height="340" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="60" y="502" fill="#047857" font-size="17" font-weight="800">🙋 ホール・店員（店舗端末）</text>
  <g font-size="12.8" fill="#1e293b">
    <text x="60" y="528">① ✍️ 口頭注文をフロアスタッフが代理入力</text>
    <text x="60" y="550">　 （管理画面→テーブル/カウンターを選択して入力）</text>
    <text x="60" y="574">② 🧾 注文一覧で状況を確認（卓別・滞在タイマー）</text>
    <text x="60" y="598">③ 🔔 客からの呼出・お会計依頼に対応</text>
    <text x="60" y="622">④ 💴 会計：現金／カード／QR（割勘・一部会計・各種割引）</text>
    <text x="60" y="646">⑤ 🖨️ レシート印刷／✉️ eレシート</text>
    <text x="60" y="670">🚫 注文取消（理由＋責任者の承認制）／⏰ 写真＋GPS打刻</text>
    <text x="60" y="694">📇 卓QRコードもこの端末から印刷</text>
    <text x="60" y="726" fill="#64748b" font-size="11.5">※ スタッフは権限に応じてログインして操作</text>
    <text x="60" y="762" fill="#047857" font-size="12" font-weight="700">🖨️ 印刷待受（対応Bluetoothプリンタ）・💳 外部決済端末と連携</text>
  </g>
  <g transform="translate(400,470)">
    <circle r="30" fill="#ffffff" stroke="#10b981" stroke-width="3"/>
    <use href="#phoneIcon" x="-14" y="-26" width="28" height="52"/>
  </g>
  <text x="400" y="511" fill="#047857" font-size="10.5" font-weight="800" text-anchor="middle">店舗用端末</text>

  <!-- ================= 管理者・オーナー ================= -->
  <rect x="900" y="430" width="360" height="380" rx="14" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
  <text x="920" y="462" fill="#7e22ce" font-size="17" font-weight="800">🧑‍💼 管理者・オーナー</text>
  <text x="920" y="482" fill="#64748b" font-size="11.5">管理コンソール（ログイン・多数タブ・権限別）</text>
  <g font-size="12.8" fill="#1e293b">
    <text x="920" y="508" font-size="11.8">📊 ダッシュボード・売上・経費・粗利／営業利益シミュレーション</text>
    <text x="920" y="530" font-size="11.8">🧾 会計履歴・再印刷／💵 レジ締め</text>
    <text x="920" y="552" font-size="11.8">📦 在庫・棚卸／🚚 仕入・発注・発注アイテム</text>
    <text x="920" y="574" font-size="11.8">🍽️ メニュー編集・レシピ原価・提供時間・KDS設定</text>
    <text x="920" y="596" font-size="11.8">💰 歩合・SC分配・スタッフ報酬</text>
    <text x="920" y="618" font-size="11.8">🎁 会員（誕生日・アレルギー・備考）・🎟️ クーポン・🗓️ 予約</text>
    <text x="920" y="640" font-size="11.8">✅ Todo・📮 店舗内申し入れ／💬 サポート（不具合・要望）</text>
    <text x="920" y="662" font-size="11.8">🕐 勤怠・給与概算／👥 ユーザー・権限マトリクス</text>
    <text x="920" y="684" font-size="11.8">🖨️ プリンタ・印刷待受／🛡️ 監査ログ／⚙️ 設定</text>
    <text x="920" y="706" font-size="11.8">💾 バックアップ・CSV書出／✉️ 定期レポート</text>
    <text x="920" y="728" font-size="11.8">💳 Proプラン・購入復元／🔐 安全な端末認証</text>
    <text x="920" y="764" fill="#7e22ce" font-size="12" font-weight="700">🧪 TEST環境で検証 → 本番へ反映</text>
  </g>
  <g transform="translate(1260,430)">
    <circle r="30" fill="#ffffff" stroke="#a855f7" stroke-width="3"/>
    <use href="#phoneIcon" x="-14" y="-26" width="28" height="52"/>
  </g>
  <text x="1260" y="471" fill="#7e22ce" font-size="10.5" font-weight="800" text-anchor="middle">管理者端末</text>

  <!-- ================= 外部連携 ================= -->
  <text x="650" y="902" fill="#0f172a" font-size="14" font-weight="800" text-anchor="middle">🔌 外部連携</text>
  <g>
    <rect x="120" y="924" width="250" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <use href="#phoneIcon" x="176" y="934" width="13" height="24"/>
    <text x="219" y="951" font-size="14" fill="#94a3b8" text-anchor="middle">→</text>
    <rect x="290" y="944" width="22" height="12" rx="2" fill="#0f172a"/>
    <rect x="294" y="938" width="14" height="8" fill="#475569"/>
    <rect x="294" y="954" width="14" height="6" fill="#e2e8f0"/>
    <text x="245" y="970" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">🖨️ 対応Bluetoothプリンタ</text>
    <text x="245" y="988" font-size="10.8" fill="#64748b" text-anchor="middle">専用の印刷待受画面から自動印字</text>

    <rect x="392" y="924" width="250" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="517" y="960" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">💳 QR・カード決済</text>
    <text x="517" y="980" font-size="11.5" fill="#64748b" text-anchor="middle">店舗契約の外部決済サービス</text>

    <rect x="664" y="924" width="250" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="789" y="960" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">✉️ Resend メール</text>
    <text x="789" y="980" font-size="11.5" fill="#64748b" text-anchor="middle">eレシート・レポート・サポート通知</text>

    <rect x="936" y="924" width="244" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1058" y="960" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle"> App Store / ▶ Google Play</text>
    <text x="1058" y="980" font-size="11.5" fill="#64748b" text-anchor="middle">RevenueCatでPro課金・購入復元</text>
  </g>
</svg>
