<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Reservation</title>
  <style>
    body{ margin:0; background:#f6f7f9; color:#0f172a; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .rwrap{ max-width:460px; margin:0 auto; padding:18px; }
    .rcard{ background:#fff; border:1px solid #e5e7eb; border-radius:16px; padding:18px; }
    .rlabel{ font-size:13px; font-weight:800; display:block; margin:10px 0 4px; }
    .rfc{ width:100%; padding:12px; border:1px solid #e5e7eb; border-radius:10px; font-size:16px; font-family:inherit; box-sizing:border-box; background:#fff; }
    .rbtn{ width:100%; border:0; border-radius:12px; padding:14px; font-size:16px; font-weight:900; cursor:pointer; margin-top:16px; background:#0f172a; color:#fff; }
    .rhead{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .rhead h1{ font-size:20px; margin:0; }
    .lang-btn{ background:#eef2f7; border:0; border-radius:9px; padding:8px 12px; font-weight:800; cursor:pointer; }
    .ralert{ display:none; margin-top:12px; padding:12px; border-radius:10px; font-weight:700; }
    .rdone{ text-align:center; padding:24px 8px; }
  </style>
</head>
<body>
  <div class="rwrap">
    <div class="rhead"><h1 id="shopName">Reservation</h1><button class="lang-btn" id="langBtn" onclick="toggleLang()">JP</button></div>
    <div class="rcard" id="form">
      <p id="intro" style="color:#64748b;font-size:14px;margin:0 0 6px;"></p>
      <label class="rlabel" id="lWhen">Date & time</label><input class="rfc" type="datetime-local" id="rWhen">
      <label class="rlabel" id="lPeople">Party size</label><input class="rfc" type="number" min="1" max="100" id="rPeople" value="2">
      <label class="rlabel" id="lName">Name</label><input class="rfc" id="rName">
      <label class="rlabel" id="lPhone">Phone</label><input class="rfc" type="tel" id="rPhone">
      <label class="rlabel" id="lSeat">Seating preference</label>
      <select class="rfc" id="rSeat"><option value="">—</option><option value="table" id="oTable">Table</option><option value="counter" id="oCounter">Counter</option></select>
      <label class="rlabel" id="lNotes">Notes (optional)</label><input class="rfc" id="rNotes">
      <button class="rbtn" id="submitBtn" onclick="submitRes()">Request reservation</button>
      <div class="ralert" id="alert"></div>
    </div>
    <div class="rcard rdone" id="done" style="display:none;">
      <div style="font-size:44px;">🗓️</div>
      <h2 id="doneT" style="margin:8px 0;">Reservation requested</h2>
      <p id="doneM" style="color:#64748b;"></p>
    </div>
  </div>

  <script>
    (function(){
      var apiUrl = location.pathname.indexOf('/test/') === 0
        ? 'https://izakanpai-api-test.izakanpai.workers.dev'
        : 'https://izakanpai-api.izakanpai.workers.dev';
      window.API = {
        post:function(action,payload){
          return fetch(apiUrl+'?api=1',{
            method:'POST',
            headers:{'Content-Type':'text/plain;charset=utf-8'},
            body:JSON.stringify(Object.assign({action:action},payload||{}))
          }).then(function(r){ return r.json(); });
        }
      };
    })();
  </script>
  <script>
    var lang = (localStorage.getItem('lang')||'').match(/^(ja|en)$/) ? localStorage.getItem('lang') : 'en';
    var STORE_ID=String(new URLSearchParams(location.search).get('store')||'').trim().toLowerCase(), FORM_CONFIG={}, FORM_READY=false;
    var T = {
      en:{ shop:'Reservation', intro:'Request a table. We will contact you to confirm.', lWhen:'Date & time', lPeople:'Party size', lName:'Name', lPhone:'Phone', lSeat:'Seating preference', lNotes:'Notes (optional)', table:'Table', counter:'Counter', submit:'Request reservation', lang:'JP', needWhen:'Please choose a date & time.', needName:'Please enter your name.', doneT:'Reservation requested', doneM:'Thank you! We will contact you to confirm.', err:'Something went wrong. Please try again.', bad_datetime:'Please choose a valid future time within one year.', past_datetime:'Please choose a time at least 5 minutes from now.', datetime_too_far:'Reservations can be requested up to one year ahead.', rate_limited:'Too many requests. Please wait and try again.', invalid_reservation_link:'This reservation link is invalid.', store_not_found:'This reservation page is no longer available.', reservation_unavailable:'Online reservations are not available for this store.' },
      ja:{ shop:'ご予約', intro:'ご予約リクエストを送信します。確認のため店舗からご連絡します。', lWhen:'日時', lPeople:'人数', lName:'お名前', lPhone:'電話番号', lSeat:'席の希望', lNotes:'備考（任意）', table:'テーブル', counter:'カウンター', submit:'予約をリクエスト', lang:'EN', needWhen:'日時を選択してください。', needName:'お名前を入力してください。', doneT:'予約をリクエストしました', doneM:'ありがとうございます！確認のためご連絡します。', err:'エラーが発生しました。もう一度お試しください。', bad_datetime:'現在から1年以内の正しい日時を選択してください。', past_datetime:'現在から5分以上先の日時を選択してください。', datetime_too_far:'予約リクエストは1年先までです。', rate_limited:'送信回数が多すぎます。しばらく待ってからお試しください。', invalid_reservation_link:'予約リンクが正しくありません。', store_not_found:'この予約ページは現在ご利用いただけません。', reservation_unavailable:'この店舗ではオンライン予約を受け付けていません。' }
    };
    function t(){ return T[lang]; }
    function apply(){
      var x=t();
      document.getElementById('shopName').innerText = FORM_CONFIG.storeName || x.shop;
      document.getElementById('intro').innerText = x.intro;
      document.getElementById('lWhen').innerText=x.lWhen; document.getElementById('lPeople').innerText=x.lPeople;
      document.getElementById('lName').innerText=x.lName; document.getElementById('lPhone').innerText=x.lPhone;
      document.getElementById('lSeat').innerText=x.lSeat; document.getElementById('lNotes').innerText=x.lNotes;
      document.getElementById('oTable').innerText=(lang==='en'?FORM_CONFIG.tableLabelEn:FORM_CONFIG.tableLabelJa)||x.table; document.getElementById('oCounter').innerText=(lang==='en'?FORM_CONFIG.counterLabelEn:FORM_CONFIG.counterLabelJa)||x.counter;
      document.getElementById('submitBtn').innerText=x.submit; document.getElementById('langBtn').innerText=x.lang;
      document.getElementById('doneT').innerText=x.doneT;
    }
    window.toggleLang=function(){ lang=(lang==='ja'?'en':'ja'); try{localStorage.setItem('lang',lang);}catch(e){} apply(); };
    function alertBox(msg){ var a=document.getElementById('alert'); a.style.display='block'; a.style.background='#fee2e2'; a.style.color='#b91c1c'; a.innerText=msg; }
    window.submitRes=function(){
      var x=t();
      if(!FORM_READY){ alertBox(x.invalid_reservation_link); return; }
      var when=document.getElementById('rWhen').value;
      if(!when){ alertBox(x.needWhen); return; }
      var name=document.getElementById('rName').value.trim();
      if(!name){ alertBox(x.needName); return; }
      var res={ datetime:when, people:document.getElementById('rPeople').value, name:name, phone:document.getElementById('rPhone').value.trim(), seat:document.getElementById('rSeat').value, notes:document.getElementById('rNotes').value.trim() };
      var b=document.getElementById('submitBtn'); b.disabled=true;
      API.post('submitReservation', { storeId:STORE_ID, reservation:res }).then(function(r){ b.disabled=false;
        if(!r||r.ok===false){ alertBox(x[(r&&r.error)]||x.err); return; }
        var d=r.data||{};
        if(d.error){ alertBox(x[d.error]||x.err); return; }
        document.getElementById('form').style.display='none'; var dn=document.getElementById('done'); dn.style.display='block';
        document.getElementById('doneM').innerText=x.doneM;
      }).catch(function(){ b.disabled=false; alertBox(x.err); });
    };
    (function(){ var now=new Date(Date.now()+5*60000), max=new Date(Date.now()+366*86400000); function localValue(d){ var z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,16); } var input=document.getElementById('rWhen'); input.min=localValue(now); input.max=localValue(max); })();
    apply();
    (function(){
      var b=document.getElementById('submitBtn');
      b.disabled=true;
      if(!/^[a-z0-9][a-z0-9-]{2,31}$/.test(STORE_ID)){ alertBox(t().invalid_reservation_link); return; }
      API.post('getReservationFormConfig',{storeId:STORE_ID}).then(function(r){
        if(!r||r.ok===false){ alertBox(t()[(r&&r.error)]||t().err); return; }
        var d=(r&&r.data)||{};
        if(d.error){ alertBox(t()[d.error]||t().err); return; }
        if(d.storeId!==STORE_ID){ alertBox(t().invalid_reservation_link); return; }
        FORM_CONFIG=d; FORM_READY=true; b.disabled=false; apply();
      }).catch(function(){ alertBox(t().err); });
    })();
  </script>
</body>
</html>
