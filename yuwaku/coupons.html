<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Coupons">

  <link rel="manifest" href="./coupons.webmanifest">
  <title>Coupons</title>
  <style>
    :root{ --bg:#f6f7f9; --surface:#fff; --border:#e5e7eb; --navy:#0f172a; --text-3:#64748b; --green:#16a34a; --red:#c62828; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:var(--bg); color:var(--navy); }
    .head{ position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
    .head h1{ font-size:18px; margin:0; font-weight:900; }
    .hbtn{ background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; text-decoration:none; }
    .wrap{ padding:16px; max-width:1000px; margin:0 auto; }
    .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; }
    .hint{ color:var(--text-3); font-size:13px; line-height:1.7; margin-bottom:12px; }
    table{ width:100%; border-collapse:collapse; font-size:13px; }
    th,td{ padding:8px 6px; border-bottom:1px solid var(--border); text-align:left; vertical-align:middle; white-space:nowrap; }
    th{ font-size:11px; color:var(--text-3); white-space:nowrap; }
    input,select{ width:100%; padding:7px; border:1px solid var(--border); border-radius:8px; font-size:14px; font-family:inherit; background:var(--surface); }
    input[type=checkbox]{ width:20px; height:20px; }
    .used{ font-weight:800; color:var(--text-3); text-align:center; }
    .btn{ border:0; border-radius:11px; padding:13px; font-size:15px; font-weight:900; cursor:pointer; font-family:inherit; }
    .btn-sec{ background:#eef2f7; color:var(--navy); width:100%; margin-top:10px; }
    .btn-pri{ background:var(--navy); color:#fff; width:100%; margin-top:10px; }
    .btn-sm{ background:#eef2f7; color:var(--navy); padding:8px 10px; border-radius:8px; font-weight:800; }
    .alert{ margin-top:10px; display:none; padding:11px; border-radius:9px; font-size:14px; font-weight:700; }
  </style>
</head>
<body>
  <div class="head">
    <h1 data-t="title">🎟️ クーポン</h1>
    <div style="display:flex;gap:8px;"><button class="hbtn" data-tlang onclick="I18n.toggle()">EN</button><a class="hbtn" href="./manage.html" data-t="back">← 管理へ</a></div>
  </div>
  <div class="wrap">
    <div class="card">
      <div class="hint" data-t="hint">コードごとに種別（％割引／金額割引）、最小注文額、有効期限、利用上限、有効/無効を設定できます。客の注文画面・テイクアウトで適用されます。利用回数は自動記録されます。</div>
      <div style="overflow:auto;">
        <table id="tbl">
          <thead><tr>
            <th style="min-width:110px;" data-t="thCode">コード</th><th style="width:110px;" data-t="thType">種別</th><th style="width:80px;" data-t="thVal">値</th>
            <th style="width:90px;" data-t="thMin">最小注文</th><th style="width:140px;" data-t="thExp">有効期限</th><th style="width:70px;" data-t="thLimit">上限</th>
            <th style="width:56px;" data-t="thActive">有効</th><th style="min-width:120px;" data-t="thDesc">説明</th><th style="width:44px;" data-t="thUsed">利用</th><th style="width:40px;"></th>
          </tr></thead>
          <tbody id="rows"><tr><td colspan="10" style="color:#aaa;padding:16px;text-align:center;" data-t="loading">読み込み中…</td></tr></tbody>
        </table>
      </div>
      <button class="btn btn-sec" onclick="addRow()" data-t="addRow">＋ 行を追加</button>
      <button class="btn btn-pri" id="saveBtn" onclick="save()" data-t="save">💾 保存</button>
      <div class="alert" id="msg"></div>
    </div>
  </div>

  <script src="./config.js"></script>
  <script src="./api.js"></script>
  <script src="./i18n.js"></script>
  <script>
    var TOKEN = localStorage.getItem(window.APP_CONFIG.AUTH_STORAGE_PREFIX + 'mgmtToken') || '';
    if (!TOKEN) { location.href = './manage.html'; }
    function rpc(fn, args){ return API.post('rpc', { fn:fn, args:args||[], token:TOKEN }).then(function(r){ return r.data; }); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    window.rows = [];

    function render(){
      var html = '';
      window.rows.forEach(function(r,i){
        html += '<tr>' +
          '<td><input value="'+esc(r.code||'')+'" oninput="window.rows['+i+'].code=this.value" placeholder="CODE" style="text-transform:uppercase;"></td>' +
          '<td><select onchange="window.rows['+i+'].type=this.value">' +
            '<option value="amount"'+(r.type!=='percent'?' selected':'')+'>'+I18n.t('typeAmount')+'</option>' +
            '<option value="percent"'+(r.type==='percent'?' selected':'')+'>'+I18n.t('typePercent')+'</option></select></td>' +
          '<td><input type="number" min="0" step="any" value="'+(r.value!=null?r.value:'')+'" oninput="window.rows['+i+'].value=Number(this.value)||0"></td>' +
          '<td><input type="number" min="0" step="any" value="'+(r.min||0)+'" oninput="window.rows['+i+'].min=Number(this.value)||0"></td>' +
          '<td><input type="date" value="'+esc(r.expiry||'')+'" oninput="window.rows['+i+'].expiry=this.value"></td>' +
          '<td><input type="number" min="0" step="1" value="'+(r.limit||0)+'" oninput="window.rows['+i+'].limit=Number(this.value)||0"></td>' +
          '<td style="text-align:center;"><input type="checkbox"'+(r.active?' checked':'')+' onchange="window.rows['+i+'].active=this.checked"></td>' +
          '<td><input value="'+esc(r.desc||'')+'" oninput="window.rows['+i+'].desc=this.value"></td>' +
          '<td class="used">'+(r.used||0)+'</td>' +
          '<td><button class="btn-sm" onclick="delRow('+i+')">🗑</button></td></tr>';
      });
      if (!window.rows.length) html = '<tr><td colspan="10" style="color:#aaa;padding:16px;text-align:center;">'+I18n.t('empty')+'</td></tr>';
      document.getElementById('rows').innerHTML = html;
    }
    window.addRow = function(){ window.rows.push({ code:'', type:'amount', value:0, min:0, expiry:'', limit:0, used:0, active:true, desc:'' }); render(); };
    window.delRow = function(i){ window.rows.splice(i,1); render(); };

    window.save = function(){
      var clean = window.rows.filter(function(r){ return (r.code||'').trim(); });
      var btn = document.getElementById('saveBtn'); btn.disabled=true;
      rpc('saveCoupons', [clean]).then(function(){ btn.disabled=false; msg(I18n.t('saved'), true); })
        .catch(function(e){ btn.disabled=false; msg(I18n.t('errPrefix')+(e.message||e), false); });
    };
    function msg(text, ok){ var m=document.getElementById('msg'); m.style.display='block'; m.style.background=ok?'#dcfce7':'#fee2e2'; m.style.color=ok?'#15803d':'#b91c1c'; m.innerText=text; }

    var __loaded=false;
    rpc('getCoupons', []).then(function(list){ window.rows = (list||[]).slice(); __loaded=true; render(); })
      .catch(function(e){ if(String(e.message||e).indexOf('unauthorized')>=0){ location.href='./manage.html'; return; } document.getElementById('rows').innerHTML='<tr><td colspan="10" style="color:#b91c1c;padding:16px;">'+I18n.t('loadErr')+esc(e.message||e)+'</td></tr>'; });

    I18n.init({
      ja:{ title:'🎟️ クーポン', back:'← 管理へ', hint:'コードごとに種別（％割引／金額割引）、最小注文額、有効期限、利用上限、有効/無効を設定できます。客の注文画面・テイクアウトで適用されます。利用回数は自動記録されます。', thCode:'コード', thType:'種別', thVal:'値', thMin:'最小注文', thExp:'有効期限', thLimit:'上限', thActive:'有効', thDesc:'説明', thUsed:'利用', addRow:'＋ 行を追加', save:'💾 保存', loading:'読み込み中…', empty:'「＋ 行を追加」で登録してください', typeAmount:'金額(₱)', typePercent:'％割引', saved:'✅ 保存しました', errPrefix:'エラー: ', loadErr:'読み込みエラー: ' },
      en:{ title:'🎟️ Coupons', back:'← Manage', hint:'Set each code’s type (% off / amount off), minimum order, expiry, usage limit and on/off. Applied on the customer order & takeout screens. Usage counts are recorded automatically.', thCode:'Code', thType:'Type', thVal:'Value', thMin:'Min order', thExp:'Expiry', thLimit:'Limit', thActive:'On', thDesc:'Description', thUsed:'Used', addRow:'＋ Add row', save:'💾 Save', loading:'Loading…', empty:'Tap “＋ Add row” to register', typeAmount:'Amount(₱)', typePercent:'% off', saved:'✅ Saved', errPrefix:'Error: ', loadErr:'Load error: ' }
    }, function(){ if(__loaded) render(); });
  </script>

  <script src="./help.js"></script>
  <script>
    HelpUI.register({
      title: 'クーポン管理',
      titleEn: 'Coupons',
      items: [
        { ja: '① 登録済みのクーポンコードが表の各行に並びます。「＋ 行を追加」で新しいクーポンの行を追加できます。', en: '① Each row of the table is one registered coupon code. Tap “＋ Add row” to add a new coupon.' },
        { ja: '② 「種別」で「金額(₱)割引」か「％割引」を選び、「値」欄にその割引額または割引率を入力します。', en: '② Choose the type — “Amount(₱)” or “% off” — and enter the discount amount or percentage in the “Value” field.' },
        { ja: '③ 「最小注文」でこのクーポンを使える最低注文額、「有効期限」で使える最終日、「上限」で使用回数の上限を設定できます。', en: '③ Set “Min order” for the minimum order amount required, “Expiry” for the last valid date, and “Limit” for the maximum number of uses.' },
        { ja: '④ 「有効」のチェックを外すと、そのクーポンは客の注文画面・テイクアウトで使用できなくなります。', en: '④ Unchecking “On” disables the coupon so customers can no longer use it on the order or takeout screens.' },
        { ja: '⑤ 「説明」欄には店内向けのメモを自由に入力でき、「利用」列には自動集計された使用回数が表示されます（編集不可）。', en: '⑤ The “Description” field is a free-text note for staff, and the “Used” column shows the automatically tracked usage count (not editable).' },
        { ja: '⑥ 行の右端の🗑ボタンでその行を削除できます。', en: '⑥ Use the 🗑 button at the right of a row to delete that coupon.' },
        { ja: '⑦ 変更後は必ず「💾 保存」を押してください。コードが空の行は保存時に無視されます。', en: '⑦ Always tap “💾 Save” after making changes. Rows with an empty code are ignored when saving.' }
      ]
    });
  </script>
</body>
</html>
