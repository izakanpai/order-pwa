<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <meta name="theme-color" content="#0f172a">
  <title>システム利用イメージ</title>
  <style>
    *{ box-sizing:border-box; }
    body{ margin:0; background:#f1f5f9; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; color:#0f172a; }
    .bar{ position:sticky; top:0; z-index:10; background:#0f172a; color:#fff; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; }
    .bar h1{ font-size:15px; margin:0; font-weight:800; }
    .bar a,.bar button{ background:rgba(255,255,255,.16); color:#fff; text-decoration:none; border:0; border-radius:8px; padding:7px 11px; font-size:12.5px; font-weight:800; white-space:nowrap; font-family:inherit; cursor:pointer; }
    .wrap{ padding:12px; }
    .card{ background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:8px; overflow:auto; -webkit-overflow-scrolling:touch; }
    .card img{ width:100%; height:auto; display:block; min-width:760px; }
    .hint{ color:#64748b; font-size:12px; text-align:center; margin:10px 4px; line-height:1.7; }
  </style>
</head>
<body>
  <div class="bar">
    <h1 data-t="title">📖 システム利用イメージ</h1>
    <div style="display:flex;gap:8px;">
      <button data-tlang onclick="I18n.toggle()">EN</button>
      <a href="#" id="openLink" target="_blank" rel="noopener" data-t="openImg">画像を開く</a>
      <a href="#" id="dlLink" download data-t="saveImg">保存</a>
      <a href="./manage.html" data-t="back">← 管理へ</a>
    </div>
  </div>
  <div class="wrap">
    <div class="card">
      <img id="diagImg" src="./system-overview.svg" alt="システム利用イメージ（客・厨房・店員・管理者の流れ）">
    </div>
    <div class="hint" id="hintEl">ピンチ操作で拡大／横スクロールできます。<br>最新の図は管理側で更新すると自動で反映されます。</div>
  </div>

  <script src="./config.js"></script>
  <script src="./i18n.js"></script>
  <script>
    var SRC = { ja: './system-overview.svg', en: './system-overview-en.svg' };
    function applyDiagram(){
      var l = (window.I18n && I18n.lang) ? I18n.lang() : 'ja';
      var src = SRC[l] || SRC.ja;
      document.getElementById('diagImg').src = src;
      document.getElementById('openLink').href = src;
      document.getElementById('dlLink').href = src;
    }
    I18n.init({
      ja:{ title:'📖 システム利用イメージ', openImg:'画像を開く', saveImg:'保存', back:'← 管理へ', hint:'ピンチ操作で拡大／横スクロールできます。<br>最新の図は管理側で更新すると自動で反映されます。', alt:'システム利用イメージ（客・厨房・店員・管理者の流れ）' },
      en:{ title:'📖 System Overview', openImg:'Open image', saveImg:'Save', back:'← Manage', hint:'Pinch to zoom, or scroll sideways.<br>The latest diagram is reflected automatically when updated by an admin.', alt:'System overview (customer, kitchen, staff, admin flow)' }
    }, function(){
      document.getElementById('hintEl').innerHTML = I18n.t('hint');
      document.getElementById('diagImg').alt = I18n.t('alt');
      applyDiagram();
    });
  </script>

  <script src="./help.js"></script>
  <script>
    HelpUI.register({
      title: 'システム利用イメージ',
      titleEn: 'System overview',
      items: [
        { ja: '① 画面中央に、お客様・厨房・店員・管理者それぞれの操作の流れをまとめた1枚の図が表示されます。', en: '① The center of the screen shows a single diagram summarizing how customers, kitchen, staff and admins each use the system.' },
        { ja: '② 図は横に長いので、指でピンチ操作して拡大したり、横スクロールして細部を確認できます。', en: '② The diagram is wide — pinch to zoom in or scroll sideways to see the details.' },
        { ja: '③ 「画像を開く」で図を新しいタブで開いて大きく表示できます。', en: '③ "Open image" opens the diagram in a new tab for a larger view.' },
        { ja: '④ 「保存」で図の画像ファイルを端末に保存できます。', en: '④ "Save" downloads the diagram image to your device.' },
        { ja: '⑤ 右上の「EN」ボタンで表示言語を切り替えると、図自体も日本語版・英語版に自動で切り替わります。', en: '⑤ The "EN" button switches the display language, and the diagram image itself switches to the matching Japanese/English version automatically.' },
        { ja: '⑥ この図は管理側で最新版に更新されると、この画面にも自動的に反映されます。', en: '⑥ When an admin updates the diagram to a newer version, it is reflected here automatically.' },
        { ja: '⑦ 「← 管理へ」で管理メニューに戻ります。', en: '⑦ "← Manage" returns you to the management menu.' }
      ]
    });
  </script>
</body>
</html>
