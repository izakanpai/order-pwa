<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>izakanpai 管理画面（SPA試作版）</title>
<style>
  :root{ --bg:#f6f7f9; --surface:#fff; --border:#e5e7eb; --navy:#0f172a; --text-3:#64748b; --red:#c62828; --green:#15803d; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:var(--bg); color:var(--navy); }
  .head{ position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
  .head h1{ font-size:16px; margin:0; font-weight:900; }
  .head .r{ display:flex; gap:8px; align-items:center; font-size:13px; }
  .hbtn{ background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; }
  .wrap{ padding:16px; max-width:900px; margin:0 auto; }
  .login{ max-width:340px; margin:8vh auto; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:26px 22px; box-shadow:0 8px 24px rgba(0,0,0,.06); }
  .login .emoji{ font-size:42px; text-align:center; }
  .login h2{ text-align:center; font-size:19px; margin:8px 0 4px; }
  .fc{ width:100%; padding:12px; border:1px solid var(--border); border-radius:10px; font-size:16px; font-family:inherit; margin-bottom:12px; }
  .btn{ border:0; border-radius:11px; padding:12px 16px; font-size:14px; font-weight:900; color:#fff; background:var(--navy); cursor:pointer; font-family:inherit; }
  .btn.sm{ padding:8px 12px; font-size:13px; }
  .btn.danger{ background:var(--red); }
  .btn:disabled{ opacity:.5; cursor:default; }
  .err{ display:none; color:var(--red); font-size:13px; font-weight:700; text-align:center; margin-bottom:10px; }
  .tabs{ display:flex; gap:8px; overflow-x:auto; padding-bottom:12px; -webkit-overflow-scrolling:touch; }
  .tab{ flex:0 0 auto; background:var(--surface); border:1px solid var(--border); color:var(--text-3); border-radius:999px; padding:9px 16px; font-size:14px; font-weight:800; cursor:pointer; font-family:inherit; white-space:nowrap; }
  .tab.on{ background:var(--navy); color:#fff; border-color:var(--navy); }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
  .row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th,td{ text-align:left; padding:8px 6px; border-bottom:1px solid var(--border); }
  .muted{ color:var(--text-3); font-size:12px; }
  .hidden{ display:none; }
  .badge{ display:inline-block; padding:2px 8px; border-radius:999px; background:#eef2ff; color:#3730a3; font-size:11px; font-weight:800; }
  .badge.done{ background:#dcfce7; color:#166534; }
</style>
</head>
<body>
  <div class="head">
    <h1>⚡ izakanpai 管理（SPA試作版）</h1>
    <div class="r"><span id="who"></span><button class="hbtn hidden" id="logoutBtn">ログアウト</button></div>
  </div>
  <div class="wrap" id="loadingView"><p style="text-align:center;color:var(--text-3);margin-top:14vh;font-size:14px;">読み込み中…</p></div>
  <div class="wrap hidden" id="loginView">
    <div class="login">
      <div class="emoji">🔒</div>
      <h2>ログイン</h2>
      <div class="err" id="loginErr">IDまたはパスワードが違います</div>
      <input class="fc" id="loginId" placeholder="ログインID" autocapitalize="none" autocomplete="username">
      <input class="fc" id="loginPass" type="password" placeholder="パスワード" autocomplete="current-password">
      <button class="btn" id="loginBtn" style="width:100%;">🔓 ログイン</button>
    </div>
  </div>
  <div class="wrap hidden" id="appView">
    <div class="tabs" id="tabs"></div>
    <div id="viewRoot"></div>
  </div>

<script>
// ============================================================================
// izakanpai 管理画面 SPA試作版（2026-08-23〜）
//
// 目的: docs/yuwakuの複数ページ構成（画面遷移のたびにHTML丸ごと再読み込み）を、
// 1ファイル内でビューを切り替えるSPA構成に置き換える試作。あつしさんとの合意により
// 「まず1〜2画面を移植してパターンを固める→残りを機械的に展開」の方針で進めている。
//
// ★重要な設計変更: docs/yuwakuの他ページが使うgasApi.js（GAS互換ワイヤープロトコル、
// action=rpc+位置引数配列という古いGAS版の配線をそのまま踏襲した翻訳レイヤー）は使わず、
// admin/index.html（旧・新管理画面）と同じ「素のCloudflare API」（index.jsのROUTES、
// {ok:true,...}のフラットな形、キー引数はJSオブジェクト）に直接接続している。画面自体を
// 作り直す以上、GAS互換レイヤーを経由する理由が無いための判断（詳細はREADME参照）。
//
// ★ログイン状態の共有について: トークンの発行方式（auth.jsのmakeAuthToken）はgasApi.js側の
// login（GAS互換）もindex.js側のlogin（ROUTES）も完全に同一のため、localStorageのキー名も
// 既存のmanage.html等と同じ('mgmtToken'/'mgmtName'/'mgmtRole')にしている。これにより、
// 既にmanage.htmlでログイン済みの端末はこのSPA試作版でも再ログイン不要（逆も同様）。
//
// 現在移植済みのビュー: ToDo（todo.html相当）・申し入れ（requests.html相当）・
// レジ締め（register.html相当）。他の画面は同じパターンで順次追加していく。
// ============================================================================

const CONFIG = { API_URL: 'https://izakanpai-api.izakanpai.workers.dev', STORE_ID: 'store_001' };
// ローカル検証時はこの行のコメントを外し、上のAPI_URLをコメントアウトしてください:
// const CONFIG = { API_URL: 'http://localhost:8787', STORE_ID: 'store_001' };

// ---- 共有アプリ状態（画面遷移してもAPIを叩き直さず使い回す）----
const STATE = {
  token: localStorage.getItem('mgmtToken') || '',
  name: localStorage.getItem('mgmtName') || '',
  role: localStorage.getItem('mgmtRole') || '',
};

// ---- APIクライアント（素のCloudflare API。gasApi.js経由ではない）----
async function api(action, params) {
  const body = Object.assign({ action, token: STATE.token, storeId: CONFIG.STORE_ID }, params || {});
  const res = await fetch(CONFIG.API_URL, {
    method: 'POST', headers: { 'content-type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body),
  });
  const json = await res.json();
  if (!json.ok) { const e = new Error(json.error || 'error'); e.apiError = json.error; throw e; }
  return json;
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// ============================================================================
// ルーター: URLのハッシュ（#/todo 等）を見て、対応するビューをviewRootへmount/unmountする。
// ハッシュベースなのは、docs/yuwakuの配信先が静的ホスティング（GitHub Pages相当）で
// サーバー側のURL書き換え設定を新たに用意しなくて済むようにするため。
// ============================================================================
let currentView = null;
const VIEWS = {}; // key -> { title, mount(root), unmount() }

function renderTabs() {
  const tabsEl = document.getElementById('tabs');
  const hash = location.hash.replace('#/', '') || Object.keys(VIEWS)[0];
  tabsEl.innerHTML = Object.keys(VIEWS).map((key) =>
    `<button class="tab${key === hash ? ' on' : ''}" data-view="${key}">${esc(VIEWS[key].title)}</button>`
  ).join('');
  tabsEl.querySelectorAll('.tab').forEach((btn) => {
    btn.onclick = () => { location.hash = '#/' + btn.dataset.view; };
  });
}

async function route() {
  const key = location.hash.replace('#/', '') || Object.keys(VIEWS)[0];
  const view = VIEWS[key];
  const root = document.getElementById('viewRoot');
  if (currentView && currentView.unmount) { try { currentView.unmount(); } catch (e) {} }
  root.innerHTML = '';
  if (!view) { root.innerHTML = '<p class="muted">画面が見つかりません。</p>'; currentView = null; renderTabs(); return; }
  currentView = view;
  renderTabs();
  try {
    await view.mount(root);
  } catch (e) {
    root.innerHTML = `<div class="card"><p class="err" style="display:block;">読み込みエラー: ${esc(e.message || e)}</p></div>`;
  }
}
window.addEventListener('hashchange', route);

// ============================================================================
// ビュー: ToDo（todo.html相当）
// ============================================================================
VIEWS.todo = {
  title: '✅ ToDo',
  _timer: null,
  async mount(root) {
    root.innerHTML = `
      <div class="card">
        <div class="row">
          <input class="fc" id="todoTitle" placeholder="タイトル" style="flex:2;min-width:160px;margin:0;">
          <input class="fc" id="todoAssignee" placeholder="担当（任意）" style="flex:1;min-width:120px;margin:0;">
          <input class="fc" id="todoDue" type="date" style="flex:1;min-width:140px;margin:0;">
          <button class="btn" id="todoAddBtn">追加</button>
        </div>
      </div>
      <div class="card"><table><thead><tr><th></th><th>タイトル</th><th>担当</th><th>作成者</th><th>期限</th><th></th></tr></thead><tbody id="todoBody"></tbody></table></div>
    `;
    document.getElementById('todoAddBtn').onclick = async () => {
      const title = document.getElementById('todoTitle').value.trim();
      if (!title) return;
      await api('saveTodo', { todo: { title, assignee: document.getElementById('todoAssignee').value.trim(), due: document.getElementById('todoDue').value } });
      document.getElementById('todoTitle').value = ''; document.getElementById('todoAssignee').value = ''; document.getElementById('todoDue').value = '';
      await this.load();
    };
    await this.load();
  },
  async load() {
    const r = await api('getTodos', {});
    const body = document.getElementById('todoBody');
    if (!body) return;
    body.innerHTML = r.todos.map((t) => `
      <tr>
        <td><input type="checkbox" data-id="${esc(t.id)}" ${t.done ? 'checked' : ''} class="todoDoneChk"></td>
        <td style="${t.done ? 'text-decoration:line-through;color:var(--text-3);' : ''}">${esc(t.title)}</td>
        <td>${esc(t.assignee)}</td>
        <td class="muted">${esc(t.creator)}</td>
        <td class="muted">${esc(t.due)}</td>
        <td><button class="btn sm danger todoDelBtn" data-id="${esc(t.id)}">削除</button></td>
      </tr>`).join('') || '<tr><td colspan="6" class="muted">タスクはありません。</td></tr>';
    body.querySelectorAll('.todoDoneChk').forEach((el) => {
      el.onchange = async () => { await api('toggleTodoDone', { id: el.dataset.id, done: el.checked }); await this.load(); };
    });
    body.querySelectorAll('.todoDelBtn').forEach((el) => {
      el.onclick = async () => { await api('deleteTodo', { id: el.dataset.id }); await this.load(); };
    });
  },
  unmount() {},
};

// ============================================================================
// ビュー: 申し入れ（requests.html相当）
// ============================================================================
VIEWS.requests = {
  title: '📮 申し入れ',
  async mount(root) {
    const isManager = ['管理者', 'システム', 'マネージャー'].indexOf(STATE.role) !== -1;
    root.innerHTML = `
      <div class="card">
        <div class="row">
          <select class="fc" id="reqCategory" style="flex:1;min-width:100px;margin:0;">
            <option>設備</option><option>接客</option><option>在庫</option><option>その他</option>
          </select>
          <input class="fc" id="reqContent" placeholder="内容" style="flex:3;min-width:200px;margin:0;">
          <button class="btn" id="reqAddBtn">送信</button>
        </div>
      </div>
      <div class="card"><table><thead><tr><th>日時</th><th>カテゴリ</th><th>内容</th><th>状態</th><th>投稿者</th>${isManager ? '<th></th>' : ''}</tr></thead><tbody id="reqBody"></tbody></table></div>
    `;
    document.getElementById('reqAddBtn').onclick = async () => {
      const content = document.getElementById('reqContent').value.trim();
      if (!content) return;
      await api('submitRequest', { request: { category: document.getElementById('reqCategory').value, content } });
      document.getElementById('reqContent').value = '';
      await this.load(isManager);
    };
    await this.load(isManager);
  },
  async load(isManager) {
    const r = await api('getRequests', {});
    const body = document.getElementById('reqBody');
    if (!body) return;
    const statuses = ['未対応', '対応中', '解決済み'];
    body.innerHTML = r.requests.map((req) => `
      <tr>
        <td class="muted">${esc(req.created)}</td>
        <td>${esc(req.category)}</td>
        <td>${esc(req.content)}</td>
        <td>${isManager
          ? `<select class="fc reqStatusSel" data-id="${esc(req.id)}" style="margin:0;padding:4px 8px;">${statuses.map((s) => `<option ${s === req.status ? 'selected' : ''}>${s}</option>`).join('')}</select>`
          : `<span class="badge${req.status === '解決済み' ? ' done' : ''}">${esc(req.status)}</span>`}</td>
        <td class="muted">${esc(req.author)}</td>
        ${isManager ? `<td><button class="btn sm danger reqDelBtn" data-id="${esc(req.id)}">削除</button></td>` : ''}
      </tr>`).join('') || `<tr><td colspan="${isManager ? 6 : 5}" class="muted">申し入れはありません。</td></tr>`;
    body.querySelectorAll('.reqStatusSel').forEach((el) => {
      el.onchange = async () => { await api('updateRequestStatus', { id: el.dataset.id, status: el.value, note: '', due: '' }); await this.load(isManager); };
    });
    body.querySelectorAll('.reqDelBtn').forEach((el) => {
      el.onclick = async () => { await api('deleteRequest', { id: el.dataset.id }); await this.load(isManager); };
    });
  },
  unmount() {},
};

// ============================================================================
// ビュー: レジ締め（register.html相当）
// ============================================================================
VIEWS.register = {
  title: '💵 レジ締め',
  async mount(root) {
    root.innerHTML = '<div class="card"><p class="muted">読み込み中…</p></div>';
    await this.load();
  },
  async load() {
    const r = await api('getRegisterBundle', { month: new Date().toISOString().slice(0, 7) });
    const root = document.getElementById('viewRoot');
    if (!root) return;
    const cur = r.current;
    root.innerHTML = `
      <div class="card">
        ${cur.open ? `
          <p><b>営業中</b> 開始: ${esc(cur.openAt)} / 開始レジ金: ¥${(cur.float || 0).toLocaleString()} / 担当: ${esc(cur.staff)}</p>
          <p>現金売上: ¥${(cur.sales.cash || 0).toLocaleString()}（想定レジ金: ¥${(cur.expectedCash || 0).toLocaleString()}）</p>
          <div class="row">
            <input class="fc" id="rgCounted" type="number" placeholder="実カウント額" style="flex:1;min-width:140px;margin:0;">
            <input class="fc" id="rgCashInOut" type="number" placeholder="入出金（任意）" style="flex:1;min-width:140px;margin:0;">
            <input class="fc" id="rgMemo" placeholder="メモ（任意）" style="flex:2;min-width:160px;margin:0;">
            <button class="btn" id="rgCloseBtn">🔒 締める</button>
          </div>` : `
          <div class="row">
            <input class="fc" id="rgFloat" type="number" placeholder="開始レジ金" style="flex:1;min-width:140px;margin:0;">
            <button class="btn" id="rgOpenBtn">🔓 レジを開ける</button>
          </div>`}
      </div>
      <div class="card">
        <p class="muted">直近の締め履歴</p>
        <table><thead><tr><th>開始</th><th>終了</th><th>現金売上</th><th>過不足</th><th>担当</th></tr></thead>
        <tbody>${r.shifts.map((s) => `<tr><td class="muted">${esc(s.openAt)}</td><td class="muted">${esc(s.closeAt)}</td><td>¥${(s.cashSales || 0).toLocaleString()}</td><td style="color:${s.overShort ? 'var(--red)' : 'inherit'};">¥${(s.overShort || 0).toLocaleString()}</td><td>${esc(s.staff)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">締め履歴はありません。</td></tr>'}</tbody></table>
      </div>
    `;
    const openBtn = document.getElementById('rgOpenBtn');
    if (openBtn) openBtn.onclick = async () => {
      await api('openShift', { float: Number(document.getElementById('rgFloat').value) || 0 });
      await this.load();
    };
    const closeBtn = document.getElementById('rgCloseBtn');
    if (closeBtn) closeBtn.onclick = async () => {
      await api('closeShift', {
        counted: Number(document.getElementById('rgCounted').value) || 0,
        cashInOut: Number(document.getElementById('rgCashInOut').value) || 0,
        memo: document.getElementById('rgMemo').value,
      });
      await this.load();
    };
  },
  unmount() {},
};

// ============================================================================
// ビュー: 仕入先（purchasing.html相当）
// ============================================================================
VIEWS.suppliers = {
  title: '🚚 仕入先',
  async mount(root) {
    root.innerHTML = `
      <div class="card">
        <div class="row">
          <input class="fc" id="supName" placeholder="仕入先名" style="flex:1;min-width:120px;margin:0;">
          <input class="fc" id="supContact" placeholder="連絡先" style="flex:1;min-width:120px;margin:0;">
          <input class="fc" id="supEmail" placeholder="メール（任意）" style="flex:1;min-width:140px;margin:0;">
          <input class="fc" id="supItems" placeholder="取扱品目" style="flex:1;min-width:140px;margin:0;">
          <input class="fc" id="supMemo" placeholder="メモ" style="flex:1;min-width:120px;margin:0;">
          <button class="btn" id="supAddBtn">追加</button>
        </div>
      </div>
      <div class="card"><table><thead><tr><th>仕入先名</th><th>連絡先</th><th>メール</th><th>取扱品目</th><th>メモ</th><th></th></tr></thead><tbody id="supBody"></tbody></table></div>
    `;
    document.getElementById('supAddBtn').onclick = async () => {
      const name = document.getElementById('supName').value.trim();
      if (!name) return;
      await api('saveSupplier', { supplier: {
        name, contact: document.getElementById('supContact').value.trim(),
        email: document.getElementById('supEmail').value.trim(),
        items: document.getElementById('supItems').value.trim(),
        memo: document.getElementById('supMemo').value.trim(),
      } });
      ['supName', 'supContact', 'supEmail', 'supItems', 'supMemo'].forEach((id) => { document.getElementById(id).value = ''; });
      await this.load();
    };
    await this.load();
  },
  async load() {
    const r = await api('getSuppliers', {});
    const body = document.getElementById('supBody');
    if (!body) return;
    body.innerHTML = r.suppliers.map((s) => `
      <tr>
        <td>${esc(s.name)}</td><td>${esc(s.contact)}</td><td class="muted">${esc(s.email)}</td>
        <td>${esc(s.items)}</td><td class="muted">${esc(s.memo)}</td>
        <td><button class="btn sm danger supDelBtn" data-id="${esc(s.id)}">削除</button></td>
      </tr>`).join('') || '<tr><td colspan="6" class="muted">仕入先はありません。</td></tr>';
    body.querySelectorAll('.supDelBtn').forEach((el) => {
      el.onclick = async () => { await api('deleteSupplier', { id: el.dataset.id }); await this.load(); };
    });
  },
  unmount() {},
};

// ============================================================================
// ビュー: 発注アイテム・発注提案（order_items.html相当）
// ============================================================================
VIEWS.orderItems = {
  title: '📦 発注品目',
  async mount(root) {
    root.innerHTML = `
      <div class="card">
        <div class="row">
          <input class="fc" id="oiName" placeholder="品目名" style="flex:1;min-width:120px;margin:0;">
          <input class="fc" id="oiUnit" placeholder="単位" style="flex:1;min-width:80px;margin:0;">
          <input class="fc" id="oiSupplier" placeholder="仕入先" style="flex:1;min-width:120px;margin:0;">
          <input class="fc" id="oiMemo" placeholder="メモ" style="flex:1;min-width:120px;margin:0;">
          <button class="btn" id="oiAddBtn">追加</button>
        </div>
      </div>
      <div class="card"><table><thead><tr><th>品目名</th><th>単位</th><th>仕入先</th><th>メモ</th><th></th></tr></thead><tbody id="oiBody"></tbody></table></div>
      <div class="card">
        <p class="muted">発注提案（最小在庫を下回っている在庫を仕入先ごとにまとめたもの。
        実際の発注メール送信は未実装のため、内容を見ながら別途連絡してください）</p>
        <div id="oiSuggest"></div>
      </div>
    `;
    document.getElementById('oiAddBtn').onclick = async () => {
      const name = document.getElementById('oiName').value.trim();
      if (!name) return;
      await api('saveOrderItem', { item: {
        name, unit: document.getElementById('oiUnit').value.trim(),
        supplier: document.getElementById('oiSupplier').value.trim(),
        memo: document.getElementById('oiMemo').value.trim(),
      } });
      ['oiName', 'oiUnit', 'oiSupplier', 'oiMemo'].forEach((id) => { document.getElementById(id).value = ''; });
      await this.load();
    };
    await this.load();
  },
  async load() {
    const [r, sug] = await Promise.all([api('getOrderItems', {}), api('getReorderSuggestions', {})]);
    const body = document.getElementById('oiBody');
    if (!body) return;
    body.innerHTML = r.items.map((it) => `
      <tr>
        <td>${esc(it.name)}</td><td class="muted">${esc(it.unit)}</td><td>${esc(it.supplier)}</td><td class="muted">${esc(it.memo)}</td>
        <td><button class="btn sm danger oiDelBtn" data-id="${esc(it.id)}">削除</button></td>
      </tr>`).join('') || '<tr><td colspan="5" class="muted">発注品目はありません。</td></tr>';
    body.querySelectorAll('.oiDelBtn').forEach((el) => {
      el.onclick = async () => { await api('deleteOrderItem', { id: el.dataset.id }); await this.load(); };
    });
    const sugEl = document.getElementById('oiSuggest');
    sugEl.innerHTML = sug.groups.length ? sug.groups.map((g) => `

      await api('saveExpense', { expense: {
        date: document.getElementById('exDate').value, category: document.getElementById('exCategory').value,
        item: document.getElementById('exItem').value.trim(), amount, memo: document.getElementById('exMemo').value.trim(),
      } });
      document.getElementById('exItem').value = ''; document.getElementById('exAmount').value = ''; document.getElementById('exMemo').value = '';
      await this.load();
    };
    await this.load();
  },
  async load() {
    const [exp, profit] = await Promise.all([api('getExpenses', {}), api('getMonthlyProfit', { month: new Date().toISOString().slice(0, 7) })]);
    const body = document.getElementById('exBody');
    if (body) {
      body.innerHTML = exp.expenses.map((e) => `

      const expTotal = Object.values(profit.exp).reduce((a, b) => a + b, 0);
      const gross = profit.revenue - profit.cogsAuto;
      const net = gross - profit.wages - expTotal;
      box.innerHTML = `
        <p>売上: ¥${profit.revenue.toLocaleString()}（${profit.orders}件）</p>
        <p>原価（自動算出）: ¥${profit.cogsAuto.toLocaleString()}</p>

        <p>経費合計: ¥${expTotal.toLocaleString()}</p>
        <p style="font-weight:900;">最終利益（概算）: ¥${net.toLocaleString()}</p>
      `;
    }

  unmount() {},
};

// ============================================================================
// ビュー: 管理（admin.html相当。卓/注文管理・スタッフ呼び出し・会計）
// ★リアルタイム性が必要な画面のため、5秒間隔でポーリングして自動更新する。
// ============================================================================
VIEWS.admin = {
  title: '🍶 管理',
  _timer: null,
  _tables: [],
  async mount(root) {
    root.innerHTML = `
      <div class="card">
        <p class="muted">スタッフ呼び出し</p>
        <div id="adCalls" class="row"></div>
      </div>
      <div class="card">
        <p class="muted">卓別・注文状況（5秒ごとに自動更新）</p>
        <div id="adTables"></div>
      </div>
    `;
    const tm = await api('getTableMaster', {});
    this._tables = tm.tables;
    await this.load();
    this._timer = setInterval(() => this.load().catch(() => {}), 5000);
  },
  async load() {
    const delta = await api('getOperationsDelta', {});
    const callsEl = document.getElementById('adCalls');
    if (callsEl) {
      callsEl.innerHTML = delta.calls.length
        ? delta.calls.map((c) => `<span class="badge" style="background:#fee2e2;color:#991b1b;">卓${esc(c.table)} ${c.type === 'bill' ? '💰会計' : '🔔呼出'}（${c.ageMin}分前）<button class="btn sm adResolveBtn" data-id="${esc(c.id)}" style="margin-left:6px;padding:2px 8px;">対応済</button></span>`).join(' ')
        : '<span class="muted">呼び出しはありません。</span>';
      callsEl.querySelectorAll('.adResolveBtn').forEach((el) => { el.onclick = async () => { await api('resolveCall', { id: el.dataset.id }); await this.load(); }; });
    }
    const byTable = {};
    delta.orders.forEach((o) => { (byTable[o.table] = byTable[o.table] || []).push(o); });
    const tablesEl = document.getElementById('adTables');
    if (tablesEl) {
      const allTables = [...new Set([...this._tables, ...Object.keys(byTable)])];
      tablesEl.innerHTML = allTables.map((t) => {
        const os = byTable[t] || [];
        const party = delta.partySizes[t];
        const total = os.reduce((s, o) => s + (o.price || 0), 0);
        return `
          <div class="card" style="margin-bottom:10px;">
            <div class="row" style="justify-content:space-between;">
              <b>卓 ${esc(t)}</b>
              <span class="muted">${party ? `${party.count}名` : ''} ${os.length ? `合計 ¥${total.toLocaleString()}` : ''}</span>
            </div>
            ${os.length ? os.map((o) => `
              <div class="row" style="border-top:1px solid var(--border);padding-top:6px;">
                <span style="flex:2;">${o.items.map((it) => `${esc(it.item_name)}x${it.qty}`).join(', ')}${o.stale ? ' <span class="badge" style="background:#fee2e2;color:#991b1b;">長時間未処理</span>' : ''}</span>
                <span class="badge${o.status === '提供済' ? ' done' : ''}">${esc(o.status)}</span>
                <select class="fc adStatusSel" data-id="${esc(o.id)}" style="margin:0;padding:4px 8px;flex:0 0 auto;">
                  ${['未対応', '調理中', '提供済'].map((s) => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}
                </select>
                <button class="btn sm danger adVoidBtn" data-id="${esc(o.id)}">取消</button>
              </div>`).join('') : '<p class="muted">この卓に注文はありません。</p>'}
            ${os.length ? `<div class="row"><button class="btn sm adBillBtn" data-table="${esc(t)}">💰 会計する</button></div>` : ''}
          </div>`;
      }).join('') || '<p class="muted">卓が登録されていません。</p>';
      tablesEl.querySelectorAll('.adStatusSel').forEach((el) => {
        el.onchange = async () => { await api('updateOrderStatus', { orderId: el.dataset.id, status: el.value }); await this.load(); };
      });
      tablesEl.querySelectorAll('.adVoidBtn').forEach((el) => {
        el.onclick = async () => {
          const reason = prompt('取消理由を入力してください:');
          if (!reason) return;
          const approverLoginId = prompt('承認者のログインIDを入力してください:');
          if (!approverLoginId) return;
          const approverPassword = prompt('承認者のパスワードを入力してください:');
          if (!approverPassword) return;
          const r = await api('voidOrder', { orderId: el.dataset.id, reason, approverLoginId, approverPassword });
          if (r.error) alert('取消できませんでした: ' + r.error);
          await this.load();
        };
      });
      tablesEl.querySelectorAll('.adBillBtn').forEach((el) => {
        el.onclick = async () => {
          const table = el.dataset.table;
          if (!confirm(`卓${table}を現金会計として確定します。よろしいですか？`)) return;
          const r = await api('finalizeBill', { bill: { table, method: 'cash' } });
          if (r.error) { alert('会計できませんでした: ' + r.error); return; }
          alert(`会計しました（伝票番号 ${r.orNo}）合計 ¥${(r.total || 0).toLocaleString()}`);
          await this.load();
        };
      });
    }
  },
  unmount() { if (this._timer) { clearInterval(this._timer); this._timer = null; } },
};

// ============================================================================
// ビュー: キッチンディスプレイ（kds.html相当。厨房でのステータス進行専用）
// ★リアルタイム性が必要な画面のため、4秒間隔でポーリングして自動更新する。
// ============================================================================
VIEWS.kds = {
  title: '🍳 KDS',
  _timer: null,
  async mount(root) {
    root.innerHTML = '<div id="kdsGrid" class="row"></div>';
    await this.load();
    this._timer = setInterval(() => this.load().catch(() => {}), 4000);
  },
  async load() {
    const delta = await api('getOperationsDelta', {});
    const pending = delta.orders.filter((o) => o.status === '未対応' || o.status === '調理中').sort((a, b) => (a.date < b.date ? -1 : 1));
    const grid = document.getElementById('kdsGrid');
    if (!grid) return;
    const nextStatus = { 未対応: '調理中', 調理中: '提供済' };
    grid.innerHTML = pending.map((o) => `
      <div class="card" style="min-width:220px;flex:1;${o.stale ? 'border-color:var(--red);' : ''}">
        <div class="row" style="justify-content:space-between;"><b>卓 ${esc(o.table)}</b><span class="badge${o.status === '調理中' ? ' done' : ''}">${esc(o.status)}</span></div>
        <ul style="margin:6px 0;padding-left:18px;">${o.items.map((it) => `<li>${esc(it.item_name)} x${it.qty}</li>`).join('')}</ul>
        ${o.stale ? '<p style="color:var(--red);font-weight:800;font-size:12px;">⚠️ 長時間未処理</p>' : ''}
        <button class="btn sm kdsAdvanceBtn" data-id="${esc(o.id)}" data-next="${nextStatus[o.status] || ''}">${nextStatus[o.status] ? `→ ${nextStatus[o.status]}にする` : ''}</button>
      </div>
    `).join('') || '<p class="muted">現在、調理待ちの注文はありません。</p>';
    grid.querySelectorAll('.kdsAdvanceBtn').forEach((el) => {
      if (!el.dataset.next) return;
      el.onclick = async () => { await api('updateOrderStatus', { orderId: el.dataset.id, status: el.dataset.next }); await this.load(); };
    });
  },
  unmount() { if (this._timer) { clearInterval(this._timer); this._timer = null; } },
};

// ============================================================================
// ビュー: テイクアウト（takeout.html相当。注文自体は客側の別ページから送信されるため、
// ここでは受付一覧の閲覧・状態更新のみ）
// ============================================================================
VIEWS.takeout = {
  title: '🥡 テイクアウト',
  _timer: null,
  async mount(root) {
    root.innerHTML = `<div class="card"><table><thead><tr><th>コード</th><th>受付</th><th>受取予定</th><th>氏名</th><th>内容</th><th>金額</th><th>状態</th></tr></thead><tbody id="toBody"></tbody></table></div>`;
    await this.load();
    this._timer = setInterval(() => this.load().catch(() => {}), 6000);
  },
  async load() {
    const r = await api('getTakeoutOrders', { limit: 100 });
    const body = document.getElementById('toBody');
    if (!body) return;
    const statuses = ['未対応', '調理中', '受渡可能', '受渡済', 'キャンセル'];
    body.innerHTML = r.orders.map((o) => `
      <tr>
        <td>${esc(o.code)}</td><td class="muted">${esc(o.created)}</td><td class="muted">${esc(o.pickup)}</td>
        <td>${esc(o.name)}</td><td class="muted">${(o.items || []).map((it) => `${esc(it.name)}x${it.qty}`).join(', ')}</td>
        <td>¥${(o.subtotal || 0).toLocaleString()}</td>
        <td><select class="fc toStatusSel" data-code="${esc(o.code)}" style="margin:0;padding:4px 8px;">${statuses.map((s) => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td>
      </tr>`).join('') || '<tr><td colspan="7" class="muted">テイクアウト注文はまだありません。</td></tr>';
    body.querySelectorAll('.toStatusSel').forEach((el) => {
      el.onchange = async () => { await api('updateTakeoutStatus', { code: el.dataset.code, status: el.value }); await this.load(); };
    });
  },
  unmount() { if (this._timer) { clearInterval(this._timer); this._timer = null; } },
};

// ============================================================================
// ログイン・起動処理
// ============================================================================
function showLoading() { document.getElementById('loadingView').classList.remove('hidden'); document.getElementById('loginView').classList.add('hidden'); document.getElementById('appView').classList.add('hidden'); }
function showLogin() {
  document.getElementById('loadingView').classList.add('hidden');
  document.getElementById('loginView').classList.remove('hidden');
  document.getElementById('appView').classList.add('hidden');
  document.getElementById('logoutBtn').classList.add('hidden');
  document.getElementById('who').innerText = '';
}
async function showApp() {
  document.getElementById('loadingView').classList.add('hidden');
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
  document.getElementById('logoutBtn').classList.remove('hidden');
  document.getElementById('who').innerText = STATE.name ? ('👤 ' + STATE.name) : '';
  await route();
}
function logout() {
  localStorage.removeItem('mgmtToken'); localStorage.removeItem('mgmtName'); localStorage.removeItem('mgmtRole');
  STATE.token = ''; STATE.name = ''; STATE.role = '';
  showLogin();
}
document.getElementById('logoutBtn').onclick = logout;
document.getElementById('loginBtn').onclick = async () => {
  const id = document.getElementById('loginId').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginErr');
  errEl.style.display = 'none';
  if (!id || !pass) { errEl.textContent = 'ログインIDとパスワードを入力してください'; errEl.style.display = 'block'; return; }
  const btn = document.getElementById('loginBtn'); btn.disabled = true;
  try {
    const r = await api('login', { storeId: CONFIG.STORE_ID, loginId: id, password: pass });
    STATE.token = r.token; STATE.name = r.name; STATE.role = r.role;
    localStorage.setItem('mgmtToken', r.token); localStorage.setItem('mgmtName', r.name); localStorage.setItem('mgmtRole', r.role);
    await showApp();
  } catch (e) {
    errEl.textContent = 'IDまたはパスワードが違います';
    errEl.style.display = 'block';
  }
  btn.disabled = false;
};

(async function init() {
  showLoading();
  if (!STATE.token) { showLogin(); return; }
  try {
    await api('checkToken', {});
    await showApp();
  } catch (e) {
    logout();
  }
})();
</script>
