<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Purchasing">

  <link rel="manifest" href="./purchasing.webmanifest">
  <title>Purchasing</title>
  <style>
    :root{ --bg:#f6f7f9; --surface:#fff; --border:#e5e7eb; --navy:#0f172a; --text-3:#64748b; --red:#c62828; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:var(--bg); color:var(--navy); }
    .head{ position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
    .head h1{ font-size:18px; margin:0; font-weight:900; }
    .hbtn{ background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; text-decoration:none; }
    .wrap{ padding:16px; max-width:920px; margin:0 auto; }
    .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
    .card-title{ font-weight:900; font-size:15px; margin-bottom:12px; }
    .muted{ color:var(--text-3); font-size:12px; }
    table{ width:100%; border-collapse:collapse; font-size:13px; }
    th,td{ padding:8px 6px; border-bottom:1px solid var(--border); text-align:left; }
    th{ font-size:11px; color:var(--text-3); white-space:nowrap; }
    td.num,th.num{ text-align:right; font-variant-numeric:tabular-nums; }
    .grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .fg{ margin-bottom:8px; } .form-label{ font-size:12px; font-weight:700; display:block; margin-bottom:4px; }
    .fc{ width:100%; padding:10px; border:1px solid var(--border); border-radius:9px; font-size:15px; font-family:inherit; background:var(--surface); }
    .btn{ border:0; border-radius:11px; padding:12px 16px; font-size:15px; font-weight:900; cursor:pointer; font-family:inherit; background:var(--navy); color:#fff; }
    .btn-sm{ background:#eef2f7; color:var(--navy); border:0; border-radius:8px; padding:7px 10px; font-weight:800; cursor:pointer; }
    .sup-group{ border:1px solid var(--border); border-radius:12px; padding:10px 12px; margin-bottom:10px; }
    .sup-h{ font-weight:900; margin-bottom:6px; }
    .alert{ margin-top:10px; display:none; padding:11px; border-radius:9px; font-size:14px; font-weight:700; }
    .low{ color:#b91c1c; font-weight:800; }
  </style>
</head>
<body>
  <div class="head"><h1 data-t="title">🚚 仕入・発注</h1><div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="hbtn" data-tlang onclick="I18n.toggle()">EN</button><a class="hbtn" href="./order_items.html" data-t="orderItemsLink">📋 発注アイテム</a><a class="hbtn" href="./inventory.html" data-t="inv">📦 在庫</a><a class="hbtn" href="./manage.html" data-t="back">← 管理へ</a></div></div>
  <div class="wrap">
    <div class="card">
      <div class="card-title" data-t="newOrderTitle">🆕 新規発注</div>
      <div class="muted" data-t="newOrderHint" style="margin-bottom:10px;">仕入先を選び、品目を追加してください。メニュー・発注アイテムマスタから選ぶか、直接入力できます。入力が終わったら「発注依頼」でメールを送信します。</div>
      <div class="fg"><label class="form-label" data-t="poSupplier">仕入先</label><select id="poSupplier" class="fc" onchange="onPoSupplierChange()"></select></div>
      <div class="alert" id="poSupplierWarn" style="background:#fef9c3;color:#854d0e;"></div>
      <div style="overflow:auto;margin-top:6px;">
        <table><thead><tr>
          <th data-t="thItem">品目</th><th style="width:88px;" data-t="poThQty">数量</th><th style="width:88px;" data-t="poThUnit">単位</th><th style="width:40px;"></th>
        </tr></thead>
        <tbody id="poRows"></tbody></table>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">
        <button class="btn-sm" onclick="poAddRow()" data-t="poAddRow">＋ 行を追加</button>
        <button class="btn-sm" onclick="openPoPicker('menu')" data-t="poFromMenu">🍽️ メニューから追加</button>
        <button class="btn-sm" onclick="openPoPicker('item')" data-t="poFromItem">📋 発注アイテムから追加</button>
      </div>
      <button class="btn" style="margin-top:12px;" id="poSendBtn" onclick="sendPo()" data-t="poSendBtn">📧 発注依頼</button>
      <div class="alert" id="poMsg"></div>
    </div>

    <div class="card">
      <div class="card-title" data-t="reorderTitle">🔔 発注提案（最小在庫以下）</div>
      <div class="muted" data-t="reorderHint" style="margin-bottom:10px;">在庫が最小在庫を下回った品目を仕入先ごとにまとめます。推奨数＝最小在庫の2倍を目標に補充。</div>
      <div id="reorder"><div class="muted" data-t="loading">読み込み中…</div></div>
    </div>

    <div class="card">
      <div class="card-title" data-t="supTitle">🏢 仕入先マスタ</div>
      <div class="grid">
        <div class="fg"><label class="form-label" data-t="sName">仕入先名</label><input id="sName" class="fc"></div>
        <div class="fg"><label class="form-label" data-t="sNameEn">英語名（任意）</label><input id="sNameEn" class="fc" data-tph="phNameEn" placeholder="e.g. ABC Trading Co."></div>
      </div>
      <div class="fg"><label class="form-label" data-t="sContact">連絡先</label><input id="sContact" class="fc" data-tph="phContact" placeholder="電話・担当など"></div>
      <div class="fg"><label class="form-label" data-t="sEmail">メールアドレス（任意・発注メール送信用）</label><input id="sEmail" type="email" class="fc" data-tph="phEmail" placeholder="order@supplier.example"></div>
      <div class="fg" style="max-width:260px;"><label class="form-label" data-t="sLanguage">発注メール言語</label><select id="sLanguage" class="fc"><option value="ja" data-t="langJa">日本語</option><option value="en" data-t="langEn">英語</option><option value="both" data-t="langBoth">日本語＋英語（両方）</option></select></div>
      <div class="fg"><label class="form-label" data-t="sItems">取扱品目（任意）</label><input id="sItems" class="fc" data-tph="phItems" placeholder="例: ビール, 焼酎, 生鮮"></div>
      <div class="fg"><label class="form-label" data-t="sMemo">備考（任意）</label><input id="sMemo" class="fc"></div>
      <input type="hidden" id="sId">
      <button class="btn" id="saveBtn" onclick="save()" data-t="add">💾 登録</button>
      <div class="alert" id="msg"></div>
      <div style="overflow:auto;margin-top:14px;">
        <table><thead><tr>
          <th data-t="thName">仕入先</th><th data-t="thContact">連絡先</th><th data-t="thEmail">メール</th><th data-t="thLanguage">言語</th><th data-t="thItems">取扱品目</th><th style="width:90px;"></th>
        </tr></thead>
        <tbody id="supRows"><tr><td colspan="6" class="muted" style="padding:14px;text-align:center;" data-t="loading">読み込み中…</td></tr></tbody></table>
      </div>
    </div>
  </div>

  <!-- 新規発注：メニュー／発注アイテムマスタから品目を選ぶピッカー -->
  <div id="poPickOv" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:56;align-items:center;justify-content:center;">
    <div style="background:#fff;border-radius:16px;padding:20px;max-width:380px;width:calc(100% - 32px);">
      <div id="poPickTitle" style="font-weight:900;font-size:15px;margin-bottom:10px;"></div>
      <select id="poPickSel" class="fc" style="margin-bottom:14px;"></select>
      <button class="btn" onclick="confirmPoPick()" data-t="poPickAdd">＋ 追加</button>
      <button class="btn-sm" style="margin-top:8px;width:100%;" onclick="closePoPicker()" data-t="mvClose">閉じる</button>
    </div>
  </div>

  <script src="./config.js"></script>
  <script src="./api.js"></script>
  <script src="./i18n.js"></script>
  <script>
    var TOKEN = localStorage.getItem('mgmtToken') || '';
    if (!TOKEN) location.href = './manage.html';
    function rpc(fn,args){ return API.post('rpc',{fn:fn,args:args||[],token:TOKEN}).then(function(r){ return r.data; }); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    // 言語切替の一元ヘルパー（新しい表示・候補リストを追加する際は必ずこれを通すこと）
    function isEN(){ return !!(window.I18n && I18n.lang && I18n.lang()==='en'); }
    function loc(ja, en){ ja = ja||''; en = (en||'').trim(); return isEN() ? (en || ja) : ja; }
    var SUPS = [], REORDER = [], SYM='₱', __loaded=false;
    var MENU_ALL_PO = [], ORDER_ITEMS_PO = [];
    var PO_ROWS = [{ name:'', nameEn:'', qty:1, unit:'' }];

    // ── 新規発注（自由入力） ──
    function poRenderRows(){
      var html = PO_ROWS.map(function(r,i){
        return '<tr>'+
          '<td><input value="'+esc(r.name)+'" oninput="PO_ROWS['+i+'].name=this.value;PO_ROWS['+i+'].nameEn=\'\'"></td>'+
          '<td><input type="number" min="0" step="any" value="'+(r.qty||'')+'" oninput="PO_ROWS['+i+'].qty=Number(this.value)||0"></td>'+
          '<td><input value="'+esc(r.unit||'')+'" oninput="PO_ROWS['+i+'].unit=this.value"></td>'+
          '<td><button class="btn-sm" onclick="poDelRow('+i+')">🗑</button></td></tr>';
      }).join('');
      if(!PO_ROWS.length) html = '<tr><td colspan="4" style="color:#aaa;padding:14px;text-align:center;">'+I18n.t('poEmpty')+'</td></tr>';
      document.getElementById('poRows').innerHTML = html;
    }
    window.poAddRow = function(){ PO_ROWS.push({ name:'', nameEn:'', qty:1, unit:'' }); poRenderRows(); };
    window.poDelRow = function(i){ PO_ROWS.splice(i,1); poRenderRows(); };

    function fillPoSupplierSel(){
      var sel = document.getElementById('poSupplier'); var cur = sel.value;
      sel.innerHTML = '<option value="">'+I18n.t('poSupplierPh')+'</option>' +
        SUPS.map(function(s){ return '<option value="'+esc(s.name)+'">'+esc(loc(s.name, s.nameEn))+(s.email?'':(' — '+I18n.t('poNoEmailTag')))+'</option>'; }).join('');
      sel.value = cur;
      onPoSupplierChange();
    }
    window.onPoSupplierChange = function(){
      var name = document.getElementById('poSupplier').value;
      var s = SUPS.filter(function(x){ return x.name===name; })[0];
      var w = document.getElementById('poSupplierWarn');
      if(name && (!s || !s.email)){ w.style.display='block'; w.innerText = I18n.t('poNoEmailWarn'); }
      else { w.style.display='none'; }
    };

    var poPickMode = null;
    window.openPoPicker = function(mode){
      poPickMode = mode;
      var sel = document.getElementById('poPickSel');
      var opts = '<option value="">'+I18n.t('poPickPh')+'</option>';
      if(mode==='menu'){
        document.getElementById('poPickTitle').textContent = I18n.t('poFromMenu');
        opts += MENU_ALL_PO.map(function(m){
          var nm = m['商品名']; if(!nm) return '';
          var disp = loc(nm, m['商品名_EN']);
          return '<option value="'+esc(nm)+'" data-unit="" data-nameen="'+esc(m['商品名_EN']||'')+'">'+esc(disp)+'</option>';
        }).join('');
      } else {
        document.getElementById('poPickTitle').textContent = I18n.t('poFromItem');
        opts += ORDER_ITEMS_PO.map(function(it){
          var disp = loc(it.name, it.nameEn);
          return '<option value="'+esc(it.name)+'" data-unit="'+esc(it.unit||'')+'" data-nameen="'+esc(it.nameEn||'')+'">'+esc(disp)+(it.unit?(' ('+esc(it.unit)+')'):'')+'</option>';
        }).join('');
      }
      sel.innerHTML = opts; sel.value='';
      document.getElementById('poPickOv').style.display='flex';
    };
    window.closePoPicker = function(){ document.getElementById('poPickOv').style.display='none'; };
    window.confirmPoPick = function(){
      var sel = document.getElementById('poPickSel');
      var name = sel.value; if(!name) return;
      var opt = sel.options[sel.selectedIndex];
      var unit = opt.getAttribute('data-unit') || '';
      var nameEn = opt.getAttribute('data-nameen') || '';
      // 空の最終行があればそこに入れる。無ければ新規行を追加。
      var last = PO_ROWS[PO_ROWS.length-1];
      if(last && !last.name && !last.qty){ last.name=name; last.nameEn=nameEn; last.qty=1; last.unit=unit; }
      else { PO_ROWS.push({ name:name, nameEn:nameEn, qty:1, unit:unit }); }
      poRenderRows(); closePoPicker();
    };
    function poMsg(text, ok){ var m=document.getElementById('poMsg'); m.style.display='block'; m.style.background=ok?'#dcfce7':'#fee2e2'; m.style.color=ok?'#15803d':'#b91c1c'; m.innerText=text; }
    window.sendPo = function(){
      var supplierName = document.getElementById('poSupplier').value;
      if(!supplierName){ poMsg(I18n.t('poNeedSupplier'), false); return; }
      var sup = SUPS.filter(function(s){ return s.name===supplierName; })[0];
      if(!sup || !sup.email){ poMsg(I18n.t('poNeedEmailFirst'), false); return; }
      var items = PO_ROWS.filter(function(r){ return (r.name||'').trim() && Number(r.qty)>0; })
        .map(function(r){ return { name:r.name.trim(), nameEn:(r.nameEn||'').trim(), qty:Number(r.qty)||0, unit:(r.unit||'').trim() }; });
      if(!items.length){ poMsg(I18n.t('poNeedItems'), false); return; }
      if(!confirm(I18n.t('poSendConfirm')+'「'+supplierName+'」（'+sup.email+'）\n'+items.length+I18n.t('poItemsCountU'))) return;
      var btn = document.getElementById('poSendBtn'); btn.disabled = true;
      rpc('sendPurchaseOrderEmail',[supplierName, items]).then(function(res){
        btn.disabled = false;
        if(res && res.success){ poMsg(I18n.t('poSendDone'), true); PO_ROWS=[{ name:'', nameEn:'', qty:1, unit:'' }]; poRenderRows(); document.getElementById('poSupplier').value=''; onPoSupplierChange(); return; }
        poMsg(I18n.t('errPrefix')+((res&&res.error)||''), false);
      }).catch(function(e){ btn.disabled=false; poMsg(I18n.t('errPrefix')+(e.message||e), false); });
    };

    function renderReorder(){
      if(!REORDER.length){ document.getElementById('reorder').innerHTML='<div class="muted">'+I18n.t('reorderEmpty')+'</div>'; return; }
      document.getElementById('reorder').innerHTML = REORDER.map(function(g, gi){
        var head = (g.supplier||I18n.t('noSupplier')) + (g.contact?(' <span class="muted">('+esc(g.contact)+')</span>'):'');
        var rows = g.items.map(function(it){
          return '<tr><td>'+esc(loc(it.name, it.nameEn))+'</td><td class="num low">'+it.stock+' '+esc(it.unit)+'</td><td class="num muted">'+it.minimum+'</td><td class="num" style="font-weight:800;">+'+it.suggest+' '+esc(it.unit)+'</td></tr>';
        }).join('');
        var mailBtn = g.supplier ?
          (g.email
            ? '<button class="btn-sm" style="background:#dcfce7;color:#15803d;" id="mailBtn'+gi+'" onclick="sendOrderEmail('+gi+')">'+I18n.t('sendMailBtn')+'</button>'
            : '<span class="muted" title="'+esc(I18n.t('noEmailHint'))+'">'+I18n.t('noEmailBadge')+'</span>')
          : '';
        return '<div class="sup-group"><div class="sup-h" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;"><span>🏢 '+head+'</span>'+mailBtn+'</div>'+
          '<table><thead><tr><th>'+I18n.t('thItem')+'</th><th class="num">'+I18n.t('thStock')+'</th><th class="num">'+I18n.t('thMin')+'</th><th class="num">'+I18n.t('thSuggest')+'</th></tr></thead><tbody>'+rows+'</tbody></table>'+
          '<div class="muted" id="mailStatus'+gi+'" style="margin-top:6px;"></div></div>';
      }).join('');
    }
    window.sendOrderEmail = function(gi){
      var g = REORDER[gi]; if(!g) return;
      var btn = document.getElementById('mailBtn'+gi); var st = document.getElementById('mailStatus'+gi);
      if(!confirm(I18n.t('sendMailConfirm')+'「'+g.supplier+'」（'+g.email+'）')) return;
      if(btn) btn.disabled = true;
      rpc('sendReorderEmail',[g.supplier]).then(function(res){
        if(btn) btn.disabled = false;
        if(res && res.success){ if(st) st.innerText = I18n.t('sendMailDone'); return; }
        if(st) st.innerText = I18n.t('sendMailFail')+((res&&res.error)||'');
      }).catch(function(e){ if(btn) btn.disabled = false; if(st) st.innerText = I18n.t('sendMailFail')+(e.message||e); });
    };
    function langLabel(v){ return v==='en' ? I18n.t('langEn') : (v==='both' ? I18n.t('langBoth') : I18n.t('langJa')); }
    function renderSups(){
      if(!SUPS.length){ document.getElementById('supRows').innerHTML='<tr><td colspan="6" class="muted" style="padding:14px;text-align:center;">'+I18n.t('supEmpty')+'</td></tr>'; return; }
      document.getElementById('supRows').innerHTML = SUPS.map(function(s){
        var nmCell = '<td style="font-weight:800;">'+esc(s.name)+(s.nameEn?' <span class="muted" style="font-weight:400;">('+esc(s.nameEn)+')</span>':'')+'</td>';
        return '<tr>'+nmCell+'<td>'+esc(s.contact)+'</td><td class="muted">'+esc(s.email||'')+'</td><td class="muted">'+esc(langLabel(s.language))+'</td><td class="muted">'+esc(s.items)+'</td>'+
          '<td><button class="btn-sm" onclick="edit(\''+s.id+'\')">'+I18n.t('edit')+'</button> <button class="btn-sm" style="background:#fee2e2;color:#b91c1c;" onclick="del(\''+s.id+'\')">'+I18n.t('del')+'</button></td></tr>';
      }).join('');
    }
    function msg(text, ok){ var m=document.getElementById('msg'); m.style.display='block'; m.style.background=ok?'#dcfce7':'#fee2e2'; m.style.color=ok?'#15803d':'#b91c1c'; m.innerText=text; }
    function clearForm(){ ['sId','sName','sNameEn','sContact','sEmail','sItems','sMemo'].forEach(function(id){ document.getElementById(id).value=''; }); document.getElementById('sLanguage').value='ja'; }

    window.edit = function(id){ var s=SUPS.filter(function(x){return x.id===id;})[0]; if(!s) return; document.getElementById('sId').value=s.id; document.getElementById('sName').value=s.name; document.getElementById('sNameEn').value=s.nameEn||''; document.getElementById('sContact').value=s.contact; document.getElementById('sEmail').value=s.email||''; document.getElementById('sLanguage').value=s.language||'ja'; document.getElementById('sItems').value=s.items; document.getElementById('sMemo').value=s.memo||''; window.scrollTo({top:9999,behavior:'smooth'}); };
    window.del = function(id){ if(!confirm(I18n.t('delConfirm'))) return; rpc('deleteSupplier',[id]).then(function(){ return reloadSups(); }).catch(function(e){ msg(I18n.t('errPrefix')+(e.message||e), false); }); };
    window.save = function(){
      var sup = { id:document.getElementById('sId').value, name:document.getElementById('sName').value.trim(), nameEn:document.getElementById('sNameEn').value.trim(), contact:document.getElementById('sContact').value.trim(), email:document.getElementById('sEmail').value.trim(), language:document.getElementById('sLanguage').value, items:document.getElementById('sItems').value.trim(), memo:document.getElementById('sMemo').value.trim() };
      if(!sup.name){ msg(I18n.t('needName'), false); return; }
      var btn=document.getElementById('saveBtn'); btn.disabled=true;
      rpc('saveSupplier',[sup]).then(function(d){ btn.disabled=false; if(d&&d.error){ msg(I18n.t('errPrefix')+d.error, false); return; } msg(I18n.t('saved'), true); clearForm(); reloadReorder(); return reloadSups(); })
        .catch(function(e){ btn.disabled=false; msg(I18n.t('errPrefix')+(e.message||e), false); });
    };
    function reloadSups(){ return rpc('getSuppliers',[]).then(function(l){ SUPS=l||[]; renderSups(); fillPoSupplierSel(); }); }
    function reloadReorder(){ return rpc('getReorderSuggestions',[]).then(function(l){ REORDER=l||[]; renderReorder(); }).catch(function(){}); }

    API.post('getSettings', {}).then(function(r){ if(r.data && r.data.currencySymbol) SYM=r.data.currencySymbol; }).catch(function(){});
    rpc('getReorderSuggestions',[]).then(function(l){ REORDER=l||[]; renderReorder(); }).catch(function(e){ document.getElementById('reorder').innerHTML='<div class="muted" style="color:#b91c1c;">'+I18n.t('loadErr')+esc(e.message||e)+'</div>'; });
    rpc('getSuppliers',[]).then(function(l){ SUPS=l||[]; __loaded=true; renderSups(); fillPoSupplierSel(); })
      .catch(function(e){ if(String(e.message||e).indexOf('unauthorized')>=0){ location.href='./manage.html'; return; } document.getElementById('supRows').innerHTML='<tr><td colspan="6" style="color:#b91c1c;padding:14px;">'+I18n.t('loadErr')+esc(e.message||e)+'</td></tr>'; });
    rpc('getAllMenuForAdmin',[]).then(function(l){ MENU_ALL_PO=l||[]; }).catch(function(){});
    rpc('getOrderItems',[]).then(function(l){ ORDER_ITEMS_PO=l||[]; }).catch(function(){});
