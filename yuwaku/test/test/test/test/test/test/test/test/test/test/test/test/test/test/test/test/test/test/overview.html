<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <meta name="theme-color" content="#0f172a">
  <title>システム利用イメージ</title>
  <style>
    *{ box-sizing:border-box; }
    body{ margin:0; background:#f1f5f9; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; color:#0f172a; }
    .bar{ position:sticky; top:0; z-index:10; background:#0f172a; color:#fff; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; }
    .bar h1{ font-size:15px; margin:0; font-weight:800; }
    .bar a{ background:rgba(255,255,255,.16); color:#fff; text-decoration:none; border-radius:8px; padding:7px 11px; font-size:12.5px; font-weight:800; white-space:nowrap; }
    .wrap{ padding:12px; }
    .card{ background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:8px; overflow:auto; -webkit-overflow-scrolling:touch; }
    .card img{ width:100%; height:auto; display:block; min-width:760px; }
    .hint{ color:#64748b; font-size:12px; text-align:center; margin:10px 4px; line-height:1.7; }
  </style>
</head>
<body>
  <div class="bar">
    <h1>📖 システム利用イメージ</h1>
    <div style="display:flex;gap:8px;">
      <a href="./system-overview.svg" target="_blank" rel="noopener">画像を開く</a>
      <a href="./system-overview.svg" download>保存</a>
    </div>
  </div>
  <div class="wrap">
    <div class="card">
      <img src="./system-overview.svg" alt="システム利用イメージ（客・厨房・店員・管理者の流れ）">
    </div>
    <div class="hint">ピンチ操作で拡大／横スクロールできます。<br>最新の図は管理側で更新すると自動で反映されます。</div>
  </div>
</body>
</html>
