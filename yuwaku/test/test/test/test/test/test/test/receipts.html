<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Receipts">

  <link rel="manifest" href="./receipts.webmanifest">
  <title>Receipts</title>
  <style>
    :root{ --bg:#f6f7f9; --surface:#fff; --border:#e5e7eb; --navy:#0f172a; --text-3:#64748b; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:var(--bg); color:var(--navy); }
    .head{ position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
    .head h1{ font-size:18px; margin:0; font-weight:900; }
    .hbtn{ background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; text-decoration:none; }
    .wrap{ padding:16px; max-width:960px; margin:0 auto; }
    .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; }
    .bar{ display:flex; gap:12px; align-items:flex-end; margin-bottom:12px; flex-wrap:wrap; }
    .fc{ padding:10px; border:1px solid var(--border); border-radius:9px; font-size:15px; font-family:inherit; background:var(--surface); }
    .form-label{ font-size:12px; font-weight:700; display:block; margin-bottom:4px; }
    .muted{ color:var(--text-3); }
    .tot{ font-weight:900; font-size:16px; }
    table{ width:100%; border-collapse:collapse; font-size:13px; }
    th,td{ padding:8px 6px; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap; }
    th{ font-size:11px; color:var(--text-3); }
    td.num,th.num{ text-align:right; font-variant-numeric:tabular-nums; }
    .btn-sm{ background:#eef2f7; color:var(--navy); border:0; border-radius:8px; padding:6px 10px; font-weight:800; cursor:pointer; }
  </style>
</head>
<body>
  <div class="head"><h1 data-t="title">🧾 会計履歴</h1><div style="display:flex;gap:8px;"><button class="hbtn" data-tlang onclick="I18n.toggle()">EN</button><a class="hbtn" href="./admin.html" data-t="toOrders">← 注文一覧</a><a class="hbtn" href="./manage.html" data-t="back">管理へ</a></div></div>
  <div class="wrap"><div class="card">
    <div class="bar">
      <div><label class="form-label" data-t="month">対象月</label><input id="month" type="month" class="fc"></div>
      <div style="flex:1;"></div>
      <div style="text-align:right;"><div class="muted" data-t="monthTotal">月合計</div><div class="tot" id="total">—</div><div class="muted" id="cnt"></div></div>
    </div>
    <div style="overflow:auto;">
      <table><thead><tr>
        <th data-t="thTime">日時</th><th data-t="thOr">OR番号</th><th data-t="thTable">卓</th>
        <th class="num" data-t="thTotal">合計</th><th data-t="thMethod">支払</th><th data-t="thDisc">割引</th><th></th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="7" class="muted" style="padding:16px;text-align:center;" data-t="loading">読み込み中…</td></tr></tbody></table>
    </div>
  </div></div>

  <script src="./config.js"></script>
  <script src="./api.js"></script>
  <script src="./i18n.js"></script>
  <script>
    var TOKEN = localStorage.getItem('mgmtToken') || '';
    if (!TOKEN) location.href = './manage.html';
    function rpc(fn,args){ return API.post('rpc',{fn:fn,args:args||[],token:TOKEN}).then(function(r){ return r.data; }); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    var ROWS=[], SYM='₱', __loaded=false, MENU_EN={};
    function seatLabel(v){ var s=String(v==null?'':v); var en=(window.I18n&&I18n.lang&&I18n.lang()==='en'); var m=s.match(/^テーブル(\d+)$/); if(m) return (en?'Table ':'テーブル')+m[1]; var c=s.match(/^カウンター(\d+)$/); if(c) return (en?'Counter ':'カウンター')+c[1]; return s; }
    function transDetails(details){
      if (!(window.I18n && I18n.lang && I18n.lang()==='en')) return details;
      return String(details||'').split(',').map(function(tok){
        var m=tok.trim().match(/^(.+?)x(\d+)$/); if(!m) return tok;
        var nm=m[1].trim(); var base=nm.replace(/\s*[（(][^（(]*[)）]\s*$/,'').trim();
        var en=MENU_EN[base]; if(!en) return tok;
        return en + nm.slice(base.length) + 'x' + m[2];
      }).join(', ');
    }

    function render(){
      var total=0; ROWS.forEach(function(r){ total+=Number(r.total)||0; });
      document.getElementById('total').innerText = SYM + total.toLocaleString();
      document.getElementById('cnt').innerText = ROWS.length + ' ' + I18n.t('bills');
      if(!ROWS.length){ document.getElementById('rows').innerHTML='<tr><td colspan="7" class="muted" style="padding:16px;text-align:center;">'+I18n.t('empty')+'</td></tr>'; return; }
      document.getElementById('rows').innerHTML = ROWS.map(function(r){
        var disc = (Number(r.discountAmount)>0) ? ('-'+SYM+(Number(r.discountAmount)||0).toLocaleString()+(r.discountType?(' '+esc(r.discountType)):'')) : '';
        var main = '<tr><td class="muted">'+esc(r.datetime)+'</td><td style="font-weight:800;">'+esc(r.orNo)+'</td><td>'+esc(seatLabel(r.table))+'</td>'+
          '<td class="num" style="font-weight:800;">'+SYM+(Number(r.total)||0).toLocaleString()+'</td><td>'+esc(r.method)+'</td><td class="muted">'+disc+'</td>'+
          '<td><button class="btn-sm" onclick="reprint(\''+esc(r.orNo).replace(/'/g,"\\'")+'\')">'+I18n.t('reprint')+'</button></td></tr>';
        // 明細（あれば2行目に表示）
        var det = (r.details||'').trim();
        var detRow = det ? ('<tr><td></td><td colspan="6" class="muted" style="white-space:normal;padding-top:0;font-size:12px;">🧾 '+esc(transDetails(det))+'</td></tr>') : '';
        return main + detRow;
      }).join('');
    }
    window.reprint = function(orNo){ rpc('reprintReceipt',[orNo]).then(function(d){ d=d||{}; if(d.ok){ alert(I18n.t('sent')); } else { alert(I18n.t('errPrefix')+(d.error||'error')); } }).catch(function(e){ alert(I18n.t('errPrefix')+(e.message||e)); }); };
    function load(){ var mo=document.getElementById('month').value; rpc('getReceipts',[mo]).then(function(l){ ROWS=l||[]; render(); }).catch(function(e){ if(String(e.message||e).indexOf('unauthorized')>=0){ location.href='./manage.html'; return; } document.getElementById('rows').innerHTML='<tr><td colspan="7" style="color:#b91c1c;padding:16px;">'+I18n.t('loadErr')+esc(e.message||e)+'</td></tr>'; }); }
    document.getElementById('month').value = new Date().toISOString().slice(0,7);
    document.getElementById('month').addEventListener('change', load);

    API.post('getSettings', {}).then(function(r){ if(r.data && r.data.currencySymbol) SYM=r.data.currencySymbol; render(); }).catch(function(){});
    rpc('getAllMenuForAdmin',[]).then(function(l){ (l||[]).forEach(function(m){ if(m['商品名']&&m['商品名_EN']) MENU_EN[String(m['商品名'])]=String(m['商品名_EN']); }); render(); }).catch(function(){});
    __loaded=true; load();

    I18n.init({
      ja:{ title:'🧾 会計履歴', back:'管理へ', toOrders:'← 注文一覧', month:'対象月', monthTotal:'月合計', bills:'件', thTime:'日時', thOr:'OR番号', thTable:'卓', thTotal:'合計', thMethod:'支払', thDisc:'割引', reprint:'🖨️ 再印刷', sent:'印刷キューに送信しました', loading:'読み込み中…', empty:'この月の会計はありません', errPrefix:'エラー: ', loadErr:'読み込みエラー: ' },
      en:{ title:'🧾 Receipts', back:'Manage', toOrders:'← Orders', month:'Target month', monthTotal:'Month total', bills:'bills', thTime:'Time', thOr:'OR no.', thTable:'Table', thTotal:'Total', thMethod:'Paid', thDisc:'Discount', reprint:'🖨️ Reprint', sent:'Sent to print queue', loading:'Loading…', empty:'No receipts this month', errPrefix:'Error: ', loadErr:'Load error: ' }
    }, function(){ if(__loaded) render(); });
  </script>
</body>
</html>
