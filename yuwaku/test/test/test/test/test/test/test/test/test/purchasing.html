<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Purchasing">

  <link rel="manifest" href="./purchasing.webmanifest">
  <title>Purchasing</title>
  <style>
    :root{ --bg:#f6f7f9; --surface:#fff; --border:#e5e7eb; --navy:#0f172a; --text-3:#64748b; --red:#c62828; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:var(--bg); color:var(--navy); }
    .head{ position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
    .head h1{ font-size:18px; margin:0; font-weight:900; }
    .hbtn{ background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; text-decoration:none; }
    .wrap{ padding:16px; max-width:920px; margin:0 auto; }
    .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
    .card-title{ font-weight:900; font-size:15px; margin-bottom:12px; }
    .muted{ color:var(--text-3); font-size:12px; }
    table{ width:100%; border-collapse:collapse; font-size:13px; }
    th,td{ padding:8px 6px; border-bottom:1px solid var(--border); text-align:left; }
    th{ font-size:11px; color:var(--text-3); white-space:nowrap; }
    td.num,th.num{ text-align:right; font-variant-numeric:tabular-nums; }
    .grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .fg{ margin-bottom:8px; } .form-label{ font-size:12px; font-weight:700; display:block; margin-bottom:4px; }
    .fc{ width:100%; padding:10px; border:1px solid var(--border); border-radius:9px; font-size:15px; font-family:inherit; background:var(--surface); }
    .btn{ border:0; border-radius:11px; padding:12px 16px; font-size:15px; font-weight:900; cursor:pointer; font-family:inherit; background:var(--navy); color:#fff; }
    .btn-sm{ background:#eef2f7; color:var(--navy); border:0; border-radius:8px; padding:7px 10px; font-weight:800; cursor:pointer; }
    .sup-group{ border:1px solid var(--border); border-radius:12px; padding:10px 12px; margin-bottom:10px; }
    .sup-h{ font-weight:900; margin-bottom:6px; }
    .alert{ margin-top:10px; display:none; padding:11px; border-radius:9px; font-size:14px; font-weight:700; }
    .low{ color:#b91c1c; font-weight:800; }
  </style>
</head>
<body>
  <div class="head"><h1 data-t="title">🚚 仕入・発注</h1><div style="display:flex;gap:8px;"><button class="hbtn" data-tlang onclick="I18n.toggle()">EN</button><a class="hbtn" href="./inventory.html" data-t="inv">📦 在庫</a><a class="hbtn" href="./manage.html" data-t="back">← 管理へ</a></div></div>
  <div class="wrap">
    <div class="card">
      <div class="card-title" data-t="reorderTitle">🔔 発注提案（最小在庫以下）</div>
      <div class="muted" data-t="reorderHint" style="margin-bottom:10px;">在庫が最小在庫を下回った品目を仕入先ごとにまとめます。推奨数＝最小在庫の2倍を目標に補充。</div>
      <div id="reorder"><div class="muted" data-t="loading">読み込み中…</div></div>
    </div>

    <div class="card">
      <div class="card-title" data-t="supTitle">🏢 仕入先マスタ</div>
      <div class="grid">
        <div class="fg"><label class="form-label" data-t="sName">仕入先名</label><input id="sName" class="fc"></div>
        <div class="fg"><label class="form-label" data-t="sContact">連絡先</label><input id="sContact" class="fc" data-tph="phContact" placeholder="電話・担当など"></div>
      </div>
      <div class="fg"><label class="form-label" data-t="sItems">取扱品目（任意）</label><input id="sItems" class="fc" data-tph="phItems" placeholder="例: ビール, 焼酎, 生鮮"></div>
      <div class="fg"><label class="form-label" data-t="sMemo">備考（任意）</label><input id="sMemo" class="fc"></div>
      <input type="hidden" id="sId">
      <button class="btn" id="saveBtn" onclick="save()" data-t="add">💾 登録</button>
      <div class="alert" id="msg"></div>
      <div style="overflow:auto;margin-top:14px;">
        <table><thead><tr>
          <th data-t="thName">仕入先</th><th data-t="thContact">連絡先</th><th data-t="thItems">取扱品目</th><th style="width:90px;"></th>
        </tr></thead>
        <tbody id="supRows"><tr><td colspan="4" class="muted" style="padding:14px;text-align:center;" data-t="loading">読み込み中…</td></tr></tbody></table>
      </div>
    </div>
  </div>

  <script src="./config.js"></script>
  <script src="./api.js"></script>
  <script src="./i18n.js"></script>
  <script>
    var TOKEN = localStorage.getItem('mgmtToken') || '';
    if (!TOKEN) location.href = './manage.html';
    function rpc(fn,args){ return API.post('rpc',{fn:fn,args:args||[],token:TOKEN}).then(function(r){ return r.data; }); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    var SUPS = [], REORDER = [], SYM='₱', __loaded=false;

    function renderReorder(){
      if(!REORDER.length){ document.getElementById('reorder').innerHTML='<div class="muted">'+I18n.t('reorderEmpty')+'</div>'; return; }
      document.getElementById('reorder').innerHTML = REORDER.map(function(g){
        var head = (g.supplier||I18n.t('noSupplier')) + (g.contact?(' <span class="muted">('+esc(g.contact)+')</span>'):'');
        var rows = g.items.map(function(it){
          return '<tr><td>'+esc(it.name)+'</td><td class="num low">'+it.stock+' '+esc(it.unit)+'</td><td class="num muted">'+it.minimum+'</td><td class="num" style="font-weight:800;">+'+it.suggest+' '+esc(it.unit)+'</td></tr>';
        }).join('');
        return '<div class="sup-group"><div class="sup-h">🏢 '+head+'</div>'+
          '<table><thead><tr><th>'+I18n.t('thItem')+'</th><th class="num">'+I18n.t('thStock')+'</th><th class="num">'+I18n.t('thMin')+'</th><th class="num">'+I18n.t('thSuggest')+'</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
      }).join('');
    }
    function renderSups(){
      if(!SUPS.length){ document.getElementById('supRows').innerHTML='<tr><td colspan="4" class="muted" style="padding:14px;text-align:center;">'+I18n.t('supEmpty')+'</td></tr>'; return; }
      document.getElementById('supRows').innerHTML = SUPS.map(function(s){
        return '<tr><td style="font-weight:800;">'+esc(s.name)+'</td><td>'+esc(s.contact)+'</td><td class="muted">'+esc(s.items)+'</td>'+
          '<td><button class="btn-sm" onclick="edit(\''+s.id+'\')">'+I18n.t('edit')+'</button> <button class="btn-sm" style="background:#fee2e2;color:#b91c1c;" onclick="del(\''+s.id+'\')">'+I18n.t('del')+'</button></td></tr>';
      }).join('');
    }
    function msg(text, ok){ var m=document.getElementById('msg'); m.style.display='block'; m.style.background=ok?'#dcfce7':'#fee2e2'; m.style.color=ok?'#15803d':'#b91c1c'; m.innerText=text; }
    function clearForm(){ ['sId','sName','sContact','sItems','sMemo'].forEach(function(id){ document.getElementById(id).value=''; }); }

    window.edit = function(id){ var s=SUPS.filter(function(x){return x.id===id;})[0]; if(!s) return; document.getElementById('sId').value=s.id; document.getElementById('sName').value=s.name; document.getElementById('sContact').value=s.contact; document.getElementById('sItems').value=s.items; document.getElementById('sMemo').value=s.memo||''; window.scrollTo({top:9999,behavior:'smooth'}); };
    window.del = function(id){ if(!confirm(I18n.t('delConfirm'))) return; rpc('deleteSupplier',[id]).then(function(){ return reloadSups(); }).catch(function(e){ msg(I18n.t('errPrefix')+(e.message||e), false); }); };
    window.save = function(){
      var sup = { id:document.getElementById('sId').value, name:document.getElementById('sName').value.trim(), contact:document.getElementById('sContact').value.trim(), items:document.getElementById('sItems').value.trim(), memo:document.getElementById('sMemo').value.trim() };
      if(!sup.name){ msg(I18n.t('needName'), false); return; }
      var btn=document.getElementById('saveBtn'); btn.disabled=true;
      rpc('saveSupplier',[sup]).then(function(d){ btn.disabled=false; if(d&&d.error){ msg(I18n.t('errPrefix')+d.error, false); return; } msg(I18n.t('saved'), true); clearForm(); return reloadSups(); })
        .catch(function(e){ btn.disabled=false; msg(I18n.t('errPrefix')+(e.message||e), false); });
    };
    function reloadSups(){ return rpc('getSuppliers',[]).then(function(l){ SUPS=l||[]; renderSups(); }); }

    API.post('getSettings', {}).then(function(r){ if(r.data && r.data.currencySymbol) SYM=r.data.currencySymbol; }).catch(function(){});
    rpc('getReorderSuggestions',[]).then(function(l){ REORDER=l||[]; renderReorder(); }).catch(function(e){ document.getElementById('reorder').innerHTML='<div class="muted" style="color:#b91c1c;">'+I18n.t('loadErr')+esc(e.message||e)+'</div>'; });
    rpc('getSuppliers',[]).then(function(l){ SUPS=l||[]; __loaded=true; renderSups(); })
      .catch(function(e){ if(String(e.message||e).indexOf('unauthorized')>=0){ location.href='./manage.html'; return; } document.getElementById('supRows').innerHTML='<tr><td colspan="4" style="color:#b91c1c;padding:14px;">'+I18n.t('loadErr')+esc(e.message||e)+'</td></tr>'; });

    I18n.init({
      ja:{ title:'🚚 仕入・発注', back:'← 管理へ', inv:'📦 在庫', reorderTitle:'🔔 発注提案（最小在庫以下）', reorderHint:'在庫が最小在庫を下回った品目を仕入先ごとにまとめます。推奨数＝最小在庫の2倍を目標に補充。', reorderEmpty:'発注が必要な品目はありません 🎉', noSupplier:'仕入先未設定', thItem:'品目', thStock:'在庫', thMin:'最小', thSuggest:'推奨発注', supTitle:'🏢 仕入先マスタ', sName:'仕入先名', sContact:'連絡先', phContact:'電話・担当など', sItems:'取扱品目（任意）', phItems:'例: ビール, 焼酎, 生鮮', sMemo:'備考（任意）', add:'💾 登録', thName:'仕入先', thContact:'連絡先', thItems:'取扱品目', loading:'読み込み中…', supEmpty:'仕入先が未登録です', edit:'編集', del:'削除', delConfirm:'この仕入先を削除しますか？', needName:'仕入先名を入力してください', saved:'✅ 登録しました', errPrefix:'エラー: ', loadErr:'読み込みエラー: ' },
      en:{ title:'🚚 Purchasing', back:'← Manage', inv:'📦 Inventory', reorderTitle:'🔔 Reorder suggestions (at/below min)', reorderHint:'Items at or below minimum stock, grouped by supplier. Suggested qty targets twice the minimum stock.', reorderEmpty:'Nothing to reorder 🎉', noSupplier:'No supplier set', thItem:'Item', thStock:'Stock', thMin:'Min', thSuggest:'Suggested', supTitle:'🏢 Suppliers', sName:'Supplier name', sContact:'Contact', phContact:'Phone / person', sItems:'Items handled (optional)', phItems:'e.g. beer, shochu, fresh', sMemo:'Memo (optional)', add:'💾 Save', thName:'Supplier', thContact:'Contact', thItems:'Items', loading:'Loading…', supEmpty:'No suppliers yet', edit:'Edit', del:'Delete', delConfirm:'Delete this supplier?', needName:'Please enter a supplier name', saved:'✅ Saved', errPrefix:'Error: ', loadErr:'Load error: ' }
    }, function(){ if(__loaded){ renderReorder(); renderSups(); } });
  </script>
</body>
</html>
