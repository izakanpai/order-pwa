<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Change Password</title>
  <style>
    :root{ --bg:#f6f7f9; --surface:#fff; --border:#e5e7eb; --navy:#0f172a; --text-3:#64748b; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:var(--bg); color:var(--navy); }
    .head{ position:sticky; top:0; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
    .head h1{ font-size:18px; margin:0; font-weight:900; }
    .hbtn{ background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; text-decoration:none; }
    .wrap{ padding:16px; max-width:420px; margin:0 auto; }
    .card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:22px; }
    .fg{ margin-bottom:12px; }
    .form-label{ font-size:12px; font-weight:700; display:block; margin-bottom:4px; }
    .fc{ width:100%; padding:12px; border:1px solid var(--border); border-radius:10px; font-size:16px; font-family:inherit; }
    .btn{ width:100%; border:0; border-radius:11px; padding:14px; font-size:15px; font-weight:900; color:#fff; background:var(--navy); cursor:pointer; font-family:inherit; margin-top:4px; }
    .st{ margin-top:12px; font-size:14px; font-weight:700; display:none; }
  </style>
</head>
<body>
  <div class="head"><h1>🔑 パスワード変更</h1><a class="hbtn" href="./manage.html">← 管理へ</a></div>
  <div class="wrap">
    <div class="card">
      <div class="fg"><label class="form-label">現在のパスワード</label><input id="oldPass" type="password" class="fc" autocomplete="current-password"></div>
      <div class="fg"><label class="form-label">新しいパスワード（6文字以上）</label><input id="newPass" type="password" class="fc" autocomplete="new-password"></div>
      <div class="fg"><label class="form-label">新しいパスワード（確認）</label><input id="newPass2" type="password" class="fc" autocomplete="new-password"></div>
      <button class="btn" id="saveBtn" onclick="save()">🔑 変更する</button>
      <div class="st" id="st"></div>
    </div>
  </div>
  <script src="./config.js"></script>
  <script src="./api.js"></script>
  <script>
    var TOKEN = localStorage.getItem('mgmtToken') || '';
    if (!TOKEN) location.href = './manage.html';
    function $(id){ return document.getElementById(id); }
    function st(msg, ok){ var e=$('st'); e.style.display='block'; e.style.color=ok?'#15803d':'#b91c1c'; e.innerText=msg; }
    function rpc(fn,args){ return API.post('rpc',{fn:fn,args:args||[],token:TOKEN}).then(function(r){ return r.data; }); }
    window.save = function(){
      var o=$('oldPass').value, n=$('newPass').value, n2=$('newPass2').value;
      if(!o){ st('現在のパスワードを入力してください', false); return; }
      if(!n || n.length<6){ st('新しいパスワードは6文字以上にしてください', false); return; }
      if(n!==n2){ st('新しいパスワードが一致しません', false); return; }
      var btn=$('saveBtn'); btn.disabled=true;
      rpc('changeMyPassword',[o,n]).then(function(r){
        btn.disabled=false;
        if(r && r.success){ st('✅ パスワードを変更しました', true); $('oldPass').value=''; $('newPass').value=''; $('newPass2').value=''; }
        else { st(r&&r.error==='wrong_password'?'現在のパスワードが違います':(r&&r.error==='too_short'?'6文字以上にしてください':'変更できませんでした'), false); }
      }).catch(function(e){ btn.disabled=false; if(String(e.message||e).indexOf('unauthorized')>=0){ location.href='./manage.html'; return; } st('エラー: '+(e.message||e), false); });
    };
  </script>
</body>
</html>
