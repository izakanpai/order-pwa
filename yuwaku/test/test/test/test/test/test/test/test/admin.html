<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Orders">

  <link rel="manifest" href="./admin.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>Orders</title>
  <style>
    :root{ --bg:#f6f7f9; --surface:#fff; --border:#e5e7eb; --navy:#0f172a; --text-3:#64748b; --red:#c62828; --green:#16a34a; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:var(--bg); color:var(--navy); -webkit-tap-highlight-color:transparent; }
    .head{ position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
    .head h1{ font-size:18px; margin:0; font-weight:900; }
    .head .r{ display:flex; gap:8px; align-items:center; }
    .hbtn{ background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; }
    .cnt{ background:#dc2626; border-radius:999px; padding:2px 10px; font-weight:900; font-size:13px; }
    .wrap{ padding:14px; max-width:900px; margin:0 auto; }
    .tg{ background:var(--surface); border:1px solid var(--border); border-radius:14px; margin-bottom:14px; overflow:hidden; }
    .tg-h{ display:flex; justify-content:space-between; align-items:center; padding:12px 14px; background:#0b1220; color:#fff; }
    .tg-h .ti{ font-size:17px; font-weight:900; }
    .tg-h .to{ font-size:16px; font-weight:900; color:#fbbf24; }
    .row{ display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-bottom:1px solid var(--border); }
    .row.served{ opacity:.55; }
    .row .m{ flex:1; min-width:0; }
    .row .tm{ font-size:11px; color:var(--text-3); }
    .row .it{ font-size:14px; font-weight:600; margin-top:2px; }
    .row .rt{ display:flex; align-items:center; gap:10px; flex:0 0 auto; }
    .row .pr{ font-weight:900; }
    .b-xs{ border:0; border-radius:8px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; font-family:inherit; }
    .b-warn{ background:#f59e0b; color:#0f172a; }
    .served-lbl{ font-size:12px; color:var(--green); font-weight:800; }
    .prepaid{ background:#dcfce7; color:#15803d; font-weight:800; font-size:11px; padding:1px 7px; border-radius:999px; }
    .tg-a{ padding:12px 14px; }
    .b-pay{ width:100%; border:0; border-radius:11px; padding:13px; font-size:14px; font-weight:900; background:var(--green); color:#fff; cursor:pointer; font-family:inherit; }
    .empty{ text-align:center; color:var(--text-3); padding:50px 20px; font-weight:700; }
    .ov{ position:fixed; inset:0; background:rgba(0,0,0,.62); z-index:9999; display:none; align-items:center; justify-content:center; }
    .ov.on{ display:flex; }
    .card{ background:#fff; border-radius:18px; padding:22px; max-width:340px; width:calc(100% - 32px); margin:16px; max-height:90vh; overflow:auto; }
    .sum{ background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:14px; margin-bottom:16px; }
    .sr{ display:flex; justify-content:space-between; font-size:13px; color:#555; margin-bottom:3px; }
    .big{ font-size:22px; font-weight:900; color:var(--red); margin-top:4px; }
    .pbtn{ border:0; padding:15px; font-size:15px; font-weight:800; border-radius:12px; cursor:pointer; color:#fff; font-family:inherit; width:100%; margin-bottom:10px; }
    .cancel{ width:100%; padding:11px; background:none; border:1.5px solid #ddd; border-radius:9px; color:#888; font-size:14px; cursor:pointer; font-weight:700; font-family:inherit; }
    .alert{ display:none; padding:11px; border-radius:9px; font-size:13px; margin-bottom:10px; text-align:left; line-height:1.5; }
    .calls-box{ background:#fffbeb; border:1px solid #fcd34d; border-radius:12px; padding:10px 12px; }
    .calls-h{ font-weight:900; font-size:13px; color:#92400e; margin-bottom:6px; }
    .call-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:5px 0; font-size:14px; font-weight:700; border-top:1px solid #fde68a; }
    .call-row:first-of-type{ border-top:0; }
    .dwell{ font-size:11px; font-weight:800; color:#0f766e; background:#ccfbf1; border-radius:6px; padding:1px 6px; }
    .ctlbar{ display:flex; align-items:center; gap:10px; padding:10px 16px; flex-wrap:wrap; position:sticky; top:0; z-index:15; background:var(--bg,#f6f7f9); border-bottom:1px solid #e5e7eb; }
    .auto-toggle{ border:0; border-radius:12px; padding:12px 20px; font-size:16px; font-weight:900; cursor:pointer; font-family:inherit; min-width:150px; }
    .auto-toggle.on{ background:#16a34a; color:#fff; } .auto-toggle.off{ background:#e2e8f0; color:#64748b; }
    .int-group{ display:flex; gap:6px; }
    .int-btn{ border:1px solid #cbd5e1; background:#fff; color:#334155; border-radius:9px; padding:9px 13px; font-size:14px; font-weight:800; cursor:pointer; font-family:inherit; }
    .int-btn.on{ background:#0f172a; color:#fff; border-color:#0f172a; }
  </style>
</head>
<body>
  <div class="head">
    <h1 id="title">注文管理</h1>
    <div class="r">
      <a class="hbtn" href="./manage.html">← 管理</a>
      <span class="cnt" id="cnt">0</span>
      <button class="hbtn" id="langBtn" onclick="toggleLang()">EN</button>
      <button class="hbtn" onclick="load()">↻</button>
    </div>
  </div>
  <div class="ctlbar">
    <button id="autoBtn" class="auto-toggle" onclick="toggleAuto()">—</button>
    <div class="int-group" id="intGroup"></div>
    <button class="int-btn" onclick="load()" id="manualBtn">↻</button>
    <a class="int-btn" href="./receipts.html" style="text-decoration:none;display:inline-flex;align-items:center;">🧾 <span id="histLbl" style="margin-left:4px;">履歴</span></a>
  </div>
  <div class="wrap" id="callsWrap" style="display:none;"></div>
  <div class="wrap" id="list"><div class="empty" id="loadMsg">読み込み中…</div></div>

  <!-- Payment modal -->
  <div class="ov" id="payModal">
    <div class="card">
      <div id="ps1">
        <div style="font-size:17px;font-weight:900;margin-bottom:12px;" id="ps1t">お会計</div>
        <div class="sum" id="paySum"></div>
        <div id="payDisc" style="border:1px solid #e5e7eb;border-radius:10px;padding:10px;margin-bottom:10px;font-size:13px;">
          <label style="display:flex;gap:8px;align-items:center;font-weight:800;cursor:pointer;"><input type="checkbox" id="dcOn" onchange="recompPay()"><span id="dcLbl">シニア/PWD割引</span></label>
          <div id="dcBody" style="display:none;margin-top:8px;">
            <div style="display:flex;gap:14px;margin-bottom:6px;">
              <label style="cursor:pointer;"><input type="radio" name="dcType" value="senior" checked onchange="recompPay()"><span id="dcSenior"> シニア</span></label>
              <label style="cursor:pointer;"><input type="radio" name="dcType" value="pwd" onchange="recompPay()"> PWD</label>
            </div>
            <div style="display:flex;gap:8px;">
              <input id="dcId" placeholder="ID番号" style="flex:1;padding:8px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;">
              <input id="dcElig" type="number" min="0" step="any" placeholder="対象額" style="width:120px;padding:8px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;" oninput="recompPay()">
            </div>
            <div id="dcNote" style="color:#64748b;margin-top:6px;"></div>
          </div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:13px;">
          <span id="splitLbl">割り勘 ÷</span>
          <input id="splitN" type="number" min="1" value="1" style="width:70px;padding:7px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;" oninput="updSplit()">
          <span id="splitRes" style="font-weight:800;"></span>
        </div>
        <div style="margin-bottom:10px;"><input id="payEmail" type="email" placeholder="e-receipt email (任意)" autocomplete="off" style="width:100%;padding:9px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;box-sizing:border-box;"></div>
        <button class="pbtn" style="background:linear-gradient(135deg,#0f4c81,#1565c0);" onclick="startOnline('gcash')">📱 GCash</button>
        <button class="pbtn" style="background:linear-gradient(135deg,#2e7d32,#43a047);" onclick="startOnline('card')">💳 Card</button>
        <button class="pbtn" style="background:#334155;" onclick="cashPay()">💴 <span id="cashLbl">現金</span></button>
        <button class="cancel" onclick="closePay()" id="cxl1">キャンセル</button>
      </div>
      <div id="ps2" style="display:none;text-align:center;">
        <div style="font-size:17px;font-weight:900;margin-bottom:4px;" id="ps2t"></div>
        <div id="ps2loading" style="padding:20px;color:#aaa;">QR生成中…</div>
        <div style="display:inline-block;padding:8px;border:2px solid #e0e8f5;border-radius:12px;margin-bottom:12px;">
          <img id="payQr" src="" alt="QR" style="width:200px;height:200px;display:none;border-radius:6px;">
        </div>
        <a id="payLink" href="#" target="_blank" rel="noopener" style="display:block;background:#0f172a;color:#fff;text-decoration:none;border-radius:9px;padding:11px;font-size:13px;font-weight:800;margin-bottom:10px;">支払いページを開く</a>
        <button class="pbtn" style="background:#f59e0b;color:#0f172a;" onclick="checkPay()" id="checkBtn">支払い確認</button>
        <div class="alert" id="payAlert"></div>
        <button class="cancel" onclick="closePay()">キャンセル</button>
      </div>
      <div id="ps3" style="display:none;text-align:center;padding:12px 0;">
        <div style="font-size:40px;">✅</div>
        <div id="ps3lbl" style="font-weight:800;margin:8px 0;"></div>
        <div id="ps3amt" style="font-size:20px;font-weight:900;color:var(--green);margin-bottom:16px;"></div>
        <button class="pbtn" style="background:var(--green);" onclick="finalize()" id="doneBtn">完了（会計済にする）</button>
      </div>
    </div>
  </div>

  <!-- Partial checkout modal -->
  <div class="ov" id="partModal">
    <div class="card">
      <div style="font-size:17px;font-weight:900;margin-bottom:10px;" id="partT">一部会計 — 明細選択</div>
      <div id="partList" style="max-height:46vh;overflow:auto;margin-bottom:10px;"></div>
      <div style="display:flex;justify-content:space-between;font-weight:900;margin-bottom:10px;"><span id="partSelLbl">選択</span><span id="partSel">₱0</span></div>
      <button class="pbtn" style="background:var(--green);" onclick="goPartial()" id="partGo">選択分を会計</button>
      <button class="cancel" onclick="closePart()" id="partCxl">キャンセル</button>
    </div>
  </div>

  <!-- Void (cancel) modal -->
  <div class="ov" id="voidModal">
    <div class="card">
      <div style="font-size:17px;font-weight:900;margin-bottom:6px;" id="vdT">注文の取消</div>
      <div id="vdItem" style="font-size:13px;color:#475569;margin-bottom:10px;"></div>
      <label style="font-size:12px;font-weight:800;" id="vdReasonL">取消理由</label>
      <input id="vdReason" style="width:100%;padding:9px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;margin:4px 0 10px;box-sizing:border-box;">
      <div style="font-size:12px;font-weight:800;margin-bottom:4px;" id="vdApprL">承認者（責任者ログイン）</div>
      <input id="vdLogin" placeholder="ログインID" autocomplete="off" style="width:100%;padding:9px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;margin-bottom:6px;box-sizing:border-box;">
      <input id="vdPass" type="password" placeholder="パスワード" autocomplete="off" style="width:100%;padding:9px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;margin-bottom:10px;box-sizing:border-box;">
      <div class="alert" id="vdAlert"></div>
      <button class="pbtn" style="background:#b91c1c;" onclick="doVoid()" id="vdGo">取消を承認</button>
      <button class="cancel" onclick="closeVoid()" id="vdCxl">キャンセル</button>
    </div>
  </div>

  <script src="./config.js"></script>
  <script src="./api.js"></script>
  <script>
    var SETTINGS = {}, PAYMONGO = false, orders = [], calls = [], voidId = '', MENU_MAP = {};
    var autoOn = (function(){ try{ var v=localStorage.getItem('adminAuto'); return v===null?true:(v==='1'); }catch(e){ return true; } })();
    var refreshSec = (function(){ try{ var v=parseInt(localStorage.getItem('adminRefreshSec'),10); return (v===10||v===30||v===60)?v:30; }catch(e){ return 30; } })();
    var refreshTimer = null;
    var lang = (localStorage.getItem('lang') || '').match(/^(ja|en)$/) ? localStorage.getItem('lang') : 'ja';
    var payTable = '', payTotal = 0, payCheckoutId = null, payMethod = 'cash', paySub = 0, payBase = null, payOrderIds = null, partTable = '';

    var i18n = {
      ja: { title:'注文管理', served:'✓ 提供済', servedBtn:'提供済にする', pay:'💳 会計する', noOrder:'未会計の注文はありません',
            cash:'現金', card:'Card', cancel:'キャンセル', pTitle:'お会計', sub:'小計', svc:'サービス料', tax:'税',
            openPay:'支払いページを開く', checkBtn:'支払い確認', checking:'確認中…', notYet:'まだ支払いが確認できません。',
            noKey:'オンライン決済は未設定です。', cashRecv:'現金を受け取りましたか？', confirmed:'支払い完了', done:'完了（会計済にする）', processing:'処理中…', lang:'EN',
            disc:'シニア/PWD割引', senior:'シニア', idPh:'ID番号', eligPh:'対象額', discLine:'割引', vatNote:'うちVAT', orLbl:'レシート番号', printBtn:'🖨️ レシート印刷', close:'閉じる', tableW:'卓', totalW:'合計',
            partial:'🧾 一部会計', partTitle:'一部会計 — 明細を選択', selected:'選択', selPay:'選択分を会計', splitLbl:'割り勘 ÷', each:'/人',
            callHdr:'🔔 呼び出し', callLbl:'スタッフ呼出', billLbl:'お会計希望', resolve:'対応済', agoMin:'分前', stay:'滞在', voidBtn:'取消', voidT:'注文の取消', reason:'取消理由', approver:'承認者（責任者ログイン）', loginPh:'ログインID', passPh:'パスワード', voidGo:'取消を承認', needReason:'取消理由を入力してください', authFail:'ログインIDまたはパスワードが違います', voided:'取消しました', alreadySettled:'会計済のため取消できません', eReceipt:'eレシート送信先メール（任意）' },
      en: { title:'Orders', served:'✓ Served', servedBtn:'Mark served', pay:'💳 Checkout', noOrder:'No open orders',
            cash:'Cash', card:'Card', cancel:'Cancel', pTitle:'Payment', sub:'Subtotal', svc:'Service', tax:'Tax',
            openPay:'Open payment page', checkBtn:'Check status', checking:'Checking…', notYet:'Payment not confirmed yet.',
            noKey:'Online payment is not set up.', cashRecv:'Cash received?', confirmed:'Paid', done:'Done (settle)', processing:'Processing…', lang:'JP',
            disc:'Senior/PWD discount', senior:'Senior', idPh:'ID no.', eligPh:'Eligible amt', discLine:'Discount', vatNote:'incl. VAT', orLbl:'Receipt no.', printBtn:'🖨️ Print receipt', close:'Close', tableW:'Table', totalW:'TOTAL',
            partial:'🧾 Partial', partTitle:'Partial checkout — select items', selected:'Selected', selPay:'Checkout selected', splitLbl:'Split ÷', each:'/person',
            callHdr:'🔔 Requests', callLbl:'Call staff', billLbl:'Bill please', resolve:'Done', agoMin:'m ago', stay:'Seated', voidBtn:'Void', voidT:'Void order', reason:'Reason', approver:'Approver (manager login)', loginPh:'Login ID', passPh:'Password', voidGo:'Approve void', needReason:'Please enter a reason', authFail:'Wrong login ID or password', voided:'Order voided', alreadySettled:'Cannot void a settled order', eReceipt:'e-receipt email (optional)' }
    };
    function t(){ return i18n[lang]; }
    function sym(){ return SETTINGS.currencySymbol || '₱'; }
    function money(v){ return sym() + (Number(v)||0).toLocaleString(); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    function fmtTime(d){ try{ return new Date(d).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
    // 席ラベルをEN/JP表示（保存値は変更しない・表示のみ）
    function seatLabel(v){ var s=String(v==null?'':v); var m=s.match(/^テーブル(\d+)$/); if(m) return (lang==='en'?'Table ':'テーブル')+m[1]; var c=s.match(/^カウンター(\d+)$/); if(c) return (lang==='en'?'Counter ':'カウンター')+c[1]; return s; }
    function breakdown(subtotal){
      var s = Number(subtotal)||0;
      var svc = Math.round(s * (Number(SETTINGS.serviceRate)||0)/100);
      var tax = Math.round((s+svc) * (Number(SETTINGS.taxRate)||0)/100);
      return { sub:s, service:svc, tax:tax, total:s+svc+tax };
    }

    window.toggleLang = function(){ lang = (lang==='ja'?'en':'ja'); try{localStorage.setItem('lang',lang);}catch(e){} applyLang(); render(); renderCalls(); renderAuto(); };
    function applyLang(){ document.getElementById('title').innerText=t().title; document.getElementById('langBtn').innerText=t().lang; var hl=document.getElementById('histLbl'); if(hl) hl.innerText=(lang==='en'?'History':'履歴'); }

    function dwellStr(ms){
      var m = Math.floor(ms/60000); if(m<1) return '';
      var h = Math.floor(m/60), mm = m%60;
      return (h>0 ? h+'h'+('0'+mm).slice(-2) : m+'m');
    }
    function render(){
      var active = orders.filter(function(o){ return o.status !== '会計済' && o.status !== '取消'; });
      document.getElementById('cnt').innerText = active.length;
      var el = document.getElementById('list');
      if (!active.length){ el.innerHTML = '<div class="empty">✅ '+t().noOrder+'</div>'; return; }
      var map = {}, order = [];
      active.slice().reverse().forEach(function(o){ var k=String(o.table); if(!map[k]){ map[k]=[]; order.push(k); } map[k].push(o); });
      var now = Date.now();
      var html = '';
      order.forEach(function(tn){
        var rows = map[tn];
        var total = rows.reduce(function(s,o){ return s + (Number(o.price)||0); }, 0);
        // 滞在タイマー：この卓の最古の注文時刻から経過
        var minT = Infinity; rows.forEach(function(o){ var d=new Date(o.date).getTime(); if(!isNaN(d)&&d<minT) minT=d; });
        var dwell = (minT!==Infinity) ? dwellStr(now-minT) : '';
        var dwellTag = dwell ? ' <span class="dwell">⏱ '+t().stay+' '+dwell+'</span>' : '';
        html += '<div class="tg"><div class="tg-h"><div class="ti">🪑 '+esc(seatLabel(tn))+dwellTag+'</div><div class="to">'+money(total)+'</div></div>';
        rows.forEach(function(o){
          var served = o.status === '提供済';
          html += '<div class="row'+(served?' served':'')+'"><div class="m"><div class="tm">🕐 '+fmtTime(o.date)+'</div>'+
            '<div class="it">'+esc(transDetails(o.details))+(o.paid?' <span class="prepaid">💳前払い</span>':'')+'</div></div>'+
            '<div class="rt"><span class="pr">'+money(o.price||0)+'</span>'+
            (served?('<span class="served-lbl">'+t().served+'</span>'):('<button class="b-xs b-warn" onclick="setServed(\''+o.id+'\')">'+t().servedBtn+'</button>'))+
            '<button class="b-xs" style="background:#fee2e2;color:#b91c1c;margin-left:4px;" onclick="askVoid(\''+o.id+'\')">'+t().voidBtn+'</button>'+
            '</div></div>';
        });
        html += '<div class="tg-a"><button class="b-pay" onclick="openPay(\''+esc(tn).replace(/'/g,"\\'")+'\','+total+')">'+t().pay+' '+money(total)+'</button>'+
          '<button class="b-xs" style="margin-top:6px;width:100%;background:#eef2f7;color:#0f172a;border:0;border-radius:9px;padding:9px;font-weight:800;cursor:pointer;" onclick="openPartial(\''+esc(tn).replace(/'/g,"\\'")+'\')">'+t().partial+'</button></div></div>';
      });
      el.innerHTML = html;
    }

    // ── スタッフ呼び出し ──
    function renderCalls(){
      var w = document.getElementById('callsWrap');
      if (!calls.length){ w.style.display='none'; w.innerHTML=''; return; }
      w.style.display='block';
      var html = '<div class="calls-box"><div class="calls-h">'+t().callHdr+'</div>';
      calls.forEach(function(c){
        var lbl = c.type==='bill' ? ('🧾 '+t().billLbl) : ('🔔 '+t().callLbl);
        var age = c.ageMin>0 ? (' · '+c.ageMin+t().agoMin) : '';
        html += '<div class="call-row"><span>🪑 '+esc(seatLabel(c.table))+' — '+lbl+age+'</span>'+
          '<button class="b-xs" style="background:#0f766e;color:#fff;" onclick="resolveCall(\''+esc(c.id).replace(/'/g,"\\'")+'\')">'+t().resolve+'</button></div>';
      });
      w.innerHTML = html + '</div>';
    }
    window.resolveCall = function(id){ API.post('resolveCall', { id:id }).then(loadCalls).catch(function(){}); };
    function loadCalls(){ return API.post('getStaffCalls', {}).then(function(r){ calls = r.data || []; renderCalls(); }).catch(function(){}); }

    // ── 注文取消（承認制） ──
    window.askVoid = function(id){
      var o = null; for(var i=0;i<orders.length;i++){ if(String(orders[i].id)===String(id)){ o=orders[i]; break; } }
      if(!o) return;
      voidId = id;
      document.getElementById('vdT').innerText = t().voidT;
      document.getElementById('vdItem').innerText = '🪑 '+seatLabel(o.table)+' · '+transDetails(o.details)+' · '+money(o.price||0);
      document.getElementById('vdReasonL').innerText = t().reason;
      document.getElementById('vdApprL').innerText = t().approver;
      document.getElementById('vdReason').value='';
      document.getElementById('vdLogin').value=''; document.getElementById('vdLogin').placeholder=t().loginPh;
      document.getElementById('vdPass').value=''; document.getElementById('vdPass').placeholder=t().passPh;
      document.getElementById('vdGo').innerText = t().voidGo; document.getElementById('vdCxl').innerText = t().cancel;
      var a=document.getElementById('vdAlert'); a.style.display='none';
      document.getElementById('voidModal').classList.add('on');
    };
    window.closeVoid = function(){ document.getElementById('voidModal').classList.remove('on'); voidId=''; };
    function vdErr(msg){ var a=document.getElementById('vdAlert'); a.style.display='block'; a.style.background='#fce8e6'; a.style.color='#b71c1c'; a.innerText=msg; }
    window.doVoid = function(){
      var reason = document.getElementById('vdReason').value.trim();
      if(!reason){ vdErr(t().needReason); return; }
      var login = document.getElementById('vdLogin').value.trim();
      var pass = document.getElementById('vdPass').value;
      var btn = document.getElementById('vdGo'); btn.disabled=true;
      API.post('voidOrder', { id:voidId, reason:reason, approverLogin:login, approverPass:pass }).then(function(r){
        btn.disabled=false; var d=r.data||{};
        if(d.error==='auth'){ vdErr(t().authFail); return; }
        if(d.error==='no_reason'){ vdErr(t().needReason); return; }
        if(d.error==='already_settled'){ vdErr(t().alreadySettled); return; }
        if(d.error){ vdErr('Error: '+d.error); return; }
        closeVoid(); load();
      }).catch(function(e){ btn.disabled=false; vdErr('Error: '+(e.message||e)); });
    };

    window.setServed = function(id){ API.post('updateOrderStatus', { id:id, status:'提供済' }).then(load).catch(load); };
    window.load = function(){
      API.post('getOrders', {}).then(function(r){ orders = r.data || []; render(); })
        .catch(function(){ var lm=document.getElementById('loadMsg'); if(lm) lm.innerText='接続できません（自動再試行します）'; });
    };
    // 明細の商品名を英語表示（メニューのEN対応。オプション括弧は原文のまま）
    function baseName(nm){ return String(nm||'').replace(/\s*[（(][^（(]*[)）]\s*$/,'').trim(); }
    function transDetails(details){
      if (lang!=='en') return details;
      return String(details||'').split(',').map(function(tok){
        var m = tok.trim().match(/^(.+?)x(\d+)$/); if(!m) return tok;
        var nm = m[1].trim(); var base = baseName(nm); var en = MENU_MAP[base];
        if(!en) return tok;
        var opt = nm.slice(base.length); // 「 (大盛り)」などの括弧部
        return en + opt + 'x' + m[2];
      }).join(',');
    }
    // ── 自動更新（間隔設定・ON/OFF・会計中は停止） ──
    function paused(){ return document.getElementById('payModal').classList.contains('on')
      || document.getElementById('partModal').classList.contains('on')
      || document.getElementById('voidModal').classList.contains('on'); }
    function tick(){ if(!autoOn) return; if(paused()) return; load(); }
    function resetTimer(){ if(refreshTimer) clearInterval(refreshTimer); refreshTimer = setInterval(tick, refreshSec*1000); }
    function renderAuto(){
      var b=document.getElementById('autoBtn');
      var en=(window.I18n && I18n.lang()==='en');
      b.className='auto-toggle '+(autoOn?'on':'off');
      b.innerText=(autoOn?(en?'🔄 Auto: ON':'🔄 自動更新: ON'):(en?'⏸ Auto: OFF':'⏸ 自動更新: OFF'));
      var g=document.getElementById('intGroup');
      g.style.opacity = autoOn?'1':'.4';
      g.innerHTML=[10,30,60].map(function(s){ return '<button class="int-btn'+(s===refreshSec?' on':'')+'" onclick="setInt('+s+')">'+s+'s</button>'; }).join('');
    }
    window.toggleAuto=function(){ autoOn=!autoOn; try{localStorage.setItem('adminAuto',autoOn?'1':'0');}catch(e){} renderAuto(); resetTimer(); };
    window.setInt=function(s){ refreshSec=s; try{localStorage.setItem('adminRefreshSec',String(s));}catch(e){} renderAuto(); resetTimer(); };

    // ── Payment ──
    window.openPay = function(tn, subtotal, orderIds){
      resetPs3();
      payMethod = 'cash';
      payTable = tn; payCheckoutId = null; payOrderIds = (orderIds && orderIds.length) ? orderIds : null; paySub = Number(subtotal)||0; payBase = breakdown(paySub);
      document.getElementById('dcOn').checked = false; document.getElementById('dcId').value=''; document.getElementById('dcElig').value='';
      var _pe=document.getElementById('payEmail'); if(_pe){ _pe.value=''; _pe.placeholder=t().eReceipt; }
      document.getElementById('splitN').value = 1; document.getElementById('splitLbl').innerText = t().splitLbl;
      document.getElementById('ps1t').innerText = t().pTitle;
      document.getElementById('cashLbl').innerText = t().cash;
      document.getElementById('cxl1').innerText = t().cancel;
      document.getElementById('dcLbl').innerText = t().disc;
      document.getElementById('dcSenior').innerText = ' '+t().senior;
      document.getElementById('dcId').placeholder = t().idPh;
      document.getElementById('dcElig').placeholder = t().eligPh;
      recompPay();
      step(1);
      document.getElementById('payModal').classList.add('on');
    };
    window.recompPay = function(){
      if (!payBase) return;
      var on = document.getElementById('dcOn').checked;
      document.getElementById('dcBody').style.display = on ? 'block' : 'none';
      var sub = paySub, b = payBase, disc = 0, eligible = 0, dtype = '';
      if (on){
        var sel = document.querySelector('input[name=dcType]:checked'); dtype = sel ? sel.value : 'senior';
        var ei = Number(document.getElementById('dcElig').value);
        eligible = (ei>0) ? Math.min(ei, sub) : sub;
        disc = Math.round(eligible - eligible/1.12*0.8);   // VAT免除＋20%引き
      }
      var total = Math.max(0, (b.total||0) - disc);
      payTotal = total;
      var vatBase = sub - eligible; var vat = Math.round(vatBase - vatBase/1.12);
      window._bill = { subtotal: sub, vat: vat, service: b.service, discountType: on?dtype:'', discountId: on?document.getElementById('dcId').value:'', discountAmount: disc, total: total };
      var html = '<div style="font-weight:900;font-size:15px;margin-bottom:8px;">🪑 '+esc(seatLabel(payTable))+'</div>';
      html += '<div class="sr"><span>'+t().sub+'</span><span>'+money(sub)+'</span></div>';
      if (b.service>0) html += '<div class="sr"><span>'+t().svc+'</span><span>'+money(b.service)+'</span></div>';
      if (b.tax>0) html += '<div class="sr"><span>'+t().tax+'</span><span>'+money(b.tax)+'</span></div>';
      if (disc>0) html += '<div class="sr" style="color:#b91c1c;"><span>'+t().discLine+' ('+(dtype==='pwd'?'PWD':t().senior)+')</span><span>− '+money(disc)+'</span></div>';
      html += '<div class="big">'+money(total)+'</div>';
      document.getElementById('paySum').innerHTML = html;
      document.getElementById('dcNote').innerText = on ? (t().vatNote+' '+money(vat)) : '';
      updSplit();
    };
    window.updSplit = function(){
      var n = Math.max(1, parseInt(document.getElementById('splitN').value,10)||1);
      document.getElementById('splitRes').innerText = n>1 ? (money(Math.ceil((payTotal||0)/n))+' '+t().each) : '';
    };
    window.openPartial = function(tn){
      partTable = tn;
      var rows = orders.filter(function(o){ return String(o.table)===String(tn) && o.status!=='会計済'; });
      document.getElementById('partList').innerHTML = rows.map(function(o){
        return '<label style="display:flex;gap:8px;align-items:center;padding:9px 2px;border-bottom:1px solid #eee;cursor:pointer;">'
          + '<input type="checkbox" class="pchk" data-id="'+esc(o.id)+'" data-price="'+(Number(o.price)||0)+'" onchange="updPart()">'
          + '<span style="flex:1;">'+esc(transDetails(o.details))+'</span><span style="font-weight:800;">'+money(o.price||0)+'</span></label>';
      }).join('') || '<div style="color:#aaa;padding:14px;">-</div>';
      document.getElementById('partT').innerText = t().partTitle;
      document.getElementById('partSelLbl').innerText = t().selected;
      document.getElementById('partGo').innerText = t().selPay;
      updPart();
      document.getElementById('partModal').classList.add('on');
    };
    window.updPart = function(){ var s=0; document.querySelectorAll('.pchk:checked').forEach(function(c){ s += Number(c.getAttribute('data-price'))||0; }); document.getElementById('partSel').innerText = money(s); };
    window.closePart = function(){ document.getElementById('partModal').classList.remove('on'); };
    window.goPartial = function(){
      var ids=[], tot=0; document.querySelectorAll('.pchk:checked').forEach(function(c){ ids.push(c.getAttribute('data-id')); tot += Number(c.getAttribute('data-price'))||0; });
      if(!ids.length) return;
      closePart(); openPay(partTable, tot, ids);
    };
    function showReceipt(orNo, bill){
      var html = '<div style="font-size:40px;">✅</div>';
      html += '<div style="font-weight:800;margin:6px 0;">'+t().orLbl+': <b>'+esc(orNo)+'</b></div>';
      html += '<div style="font-size:20px;font-weight:900;color:var(--green);margin-bottom:6px;">'+money(bill.total)+' — '+esc(seatLabel(bill.table))+'</div>';
      if (bill.discountAmount>0) html += '<div style="font-size:13px;color:#64748b;">'+t().discLine+' '+money(bill.discountAmount)+(bill.discountId?(' / ID '+esc(bill.discountId)):'')+'</div>';
      html += '<div style="display:flex;gap:8px;margin-top:14px;"><button class="pbtn" style="background:var(--green);flex:1;margin:0;" onclick="closePay();load();">'+t().close+'</button></div>';
      document.getElementById('ps3').innerHTML = html;
      window._lastBill = { orNo: orNo, bill: bill };
      step(3);
    }
    window.printReceipt = function(orNo){
      var b = (window._lastBill&&window._lastBill.bill) || window._bill || {};
      var shop = SETTINGS.shopName || 'Shop'; var now = new Date().toLocaleString();
      var lines = '<div>'+t().sub+': '+money(b.subtotal)+'</div>';
      if (b.service>0) lines += '<div>'+t().svc+': '+money(b.service)+'</div>';
      if (b.discountAmount>0) lines += '<div>'+t().discLine+': -'+money(b.discountAmount)+(b.discountId?(' (ID '+esc(b.discountId)+')'):'')+'</div>';
      lines += '<div>'+t().vatNote+': '+money(b.vat)+'</div>';
      var w = window.open('', '_blank', 'width=320,height=520'); if(!w) return;
      w.document.write('<html><head><meta charset="utf-8"><title>'+esc(orNo)+'</title></head><body style="font-family:monospace;padding:10px;width:280px;">'
        + '<div style="text-align:center;font-weight:bold;font-size:16px;">'+esc(shop)+'</div>'
        + '<div style="text-align:center;font-size:12px;margin-bottom:8px;">'+esc(orNo)+'<br>'+esc(now)+'<br>'+t().tableW+' '+esc(b.table||'')+'</div>'
        + '<hr>'+lines+'<hr>'
        + '<div style="font-weight:bold;font-size:15px;display:flex;justify-content:space-between;"><span>'+t().totalW+'</span><span>'+money(b.total)+'</span></div>'
        + '<div style="font-size:11px;margin-top:6px;">'+esc(b.method||'')+'</div>'
        + '<scr'+'ipt>window.print();<\/scr'+'ipt></body></html>');
      w.document.close();
    };
    window.closePay = function(){ document.getElementById('payModal').classList.remove('on'); payCheckoutId=null; resetPs3(); };
    function step(n){ [1,2,3].forEach(function(i){ document.getElementById('ps'+i).style.display = (i===n)?'block':'none'; }); }
    // レシート表示でps3の中身を差し替えるため、会計開始時に標準スケルトンへ復元（#doneBtn等の消失防止）
    function resetPs3(){
      document.getElementById('ps3').innerHTML =
        '<div style="font-size:40px;">✅</div>'
        + '<div id="ps3lbl" style="font-weight:800;margin:8px 0;"></div>'
        + '<div id="ps3amt" style="font-size:20px;font-weight:900;color:var(--green);margin-bottom:16px;"></div>'
        + '<button class="pbtn" style="background:var(--green);" onclick="finalize()" id="doneBtn">'+t().done+'</button>';
    }

    window.cashPay = function(){
      payMethod = 'cash';
      document.getElementById('ps3lbl').innerText = t().cashRecv;
      document.getElementById('ps3amt').innerText = money(payTotal)+' — '+seatLabel(payTable);
      document.getElementById('doneBtn').innerText = t().done;
      step(3);
    };
    window.startOnline = function(method){
      payMethod = method;
      document.getElementById('ps2t').innerText = method==='gcash'?'GCash':t().card;
      document.getElementById('payQr').style.display='none';
      document.getElementById('ps2loading').style.display='block';
      document.getElementById('payAlert').style.display='none';
      step(2);
      API.post('createCheckout', { amount: payTotal, desc: 'Table '+payTable, method: method }).then(function(r){
        var d = r.data || {};
        document.getElementById('ps2loading').style.display='none';
        if (d.error){ var a=document.getElementById('payAlert'); a.style.display='block'; a.style.background='#fce8e6'; a.style.color='#b71c1c'; a.innerText = d.error==='no_api_key'?t().noKey:d.error; return; }
        payCheckoutId = d.checkoutId;
        document.getElementById('payQr').src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(d.checkoutUrl);
        document.getElementById('payQr').style.display='block';
        document.getElementById('payLink').href = d.checkoutUrl;
        document.getElementById('payLink').innerText = t().openPay;
        document.getElementById('checkBtn').innerText = t().checkBtn;
      }).catch(function(e){ document.getElementById('ps2loading').style.display='none'; var a=document.getElementById('payAlert'); a.style.display='block'; a.style.background='#fce8e6'; a.style.color='#b71c1c'; a.innerText='Error: '+(e.message||e); });
    };
    window.checkPay = function(){
      if (!payCheckoutId) return;
      var btn = document.getElementById('checkBtn'); btn.disabled=true; btn.innerText=t().checking;
      API.post('checkoutStatus', { checkoutId: payCheckoutId }).then(function(r){
        btn.disabled=false; btn.innerText=t().checkBtn;
        var d = r.data || {}; var a=document.getElementById('payAlert'); a.style.display='block';
        if (d.error){ a.style.background='#fce8e6'; a.style.color='#b71c1c'; a.innerText = d.error==='no_api_key'?t().noKey:d.error; return; }
        if (d.paymentStatus==='paid'){ document.getElementById('ps3lbl').innerText=t().confirmed; document.getElementById('ps3amt').innerText=money(payTotal)+' — '+seatLabel(payTable); document.getElementById('doneBtn').innerText=t().done; step(3); }
        else { a.style.background='#fff8e1'; a.style.color='#856404'; a.innerText=t().notYet; }
      }).catch(function(e){ btn.disabled=false; btn.innerText=t().checkBtn; var a=document.getElementById('payAlert'); a.style.display='block'; a.style.background='#fce8e6'; a.style.color='#b71c1c'; a.innerText='Error: '+(e.message||e); });
    };
    window.finalize = function(){
      var btn = document.getElementById('doneBtn'); btn.disabled=true; btn.innerText=t().processing;
      var _em=document.getElementById('payEmail'); var email=_em?_em.value.trim():'';
      var bill = Object.assign({}, window._bill||{}, { table: payTable, method: payMethod, orderIds: payOrderIds, email: email });
      API.post('finalizeBill', bill).then(function(r){ btn.disabled=false; btn.innerText=t().done; var d=r.data||{}; showReceipt(d.orNo||'', bill); })
        .catch(function(e){ btn.disabled=false; btn.innerText=t().done; alert('Error: '+(e.message||e)); });
    };

    function boot(){
      applyLang();
      renderAuto();
      API.post('bootstrap', {}).then(function(r){
        SETTINGS = r.settings || {}; PAYMONGO = !!r.paymongo;
        (r.menu||[]).forEach(function(m){ var jp=m['商品名'], en=m['商品名_EN']; if(jp && en) MENU_MAP[String(jp)]=String(en); });
        load();
      }).catch(function(){ load(); });
      loadCalls();
      resetTimer();
      setInterval(function(){ if(autoOn && !paused()) loadCalls(); }, 8000);   // 自動更新OFF・会計中は呼び出しポーリングも停止
      if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').catch(function(){}); }
    }
    document.addEventListener('DOMContentLoaded', boot);
  </script>
</body>
</html>
