<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kitchen Disp">

  <link rel="manifest" href="./kds.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>Kitchen Display</title>
  <style>
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:#0f172a; color:#e2e8f0; -webkit-tap-highlight-color:transparent; }
    .kds-head{ position:sticky; top:0; z-index:20; background:#0f172a; border-bottom:1px solid #1e293b;
      display:flex; align-items:center; justify-content:space-between; padding:12px 16px; gap:10px; flex-wrap:wrap; }
    .kds-title{ font-size:20px; font-weight:900; letter-spacing:.5px; }
    .kds-title .sub{ font-size:12px; color:#94a3b8; font-weight:600; margin-left:8px; }
    .kds-head .actions{ display:flex; gap:8px; align-items:center; }
    .kbtn{ background:#1e293b; color:#e2e8f0; border:1px solid #334155; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; }
    .kbtn.on{ background:#16a34a; border-color:#16a34a; color:#fff; }
    .kcount{ background:#dc2626; color:#fff; border-radius:999px; padding:2px 11px; font-weight:900; font-size:14px; }
    .kgrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:12px; padding:14px; }
    .ticket{ background:#1e293b; border:1px solid #334155; border-radius:14px; overflow:hidden; display:flex; flex-direction:column; border-left:6px solid #64748b; }
    .ticket.new{ border-left-color:#dc2626; animation:pulse 1.6s ease-in-out infinite; }
    .ticket.cook{ border-left-color:#f59e0b; }
    @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(220,38,38,0); } 50%{ box-shadow:0 0 0 4px rgba(220,38,38,.35); } }
    .t-head{ display:flex; align-items:center; justify-content:space-between; padding:10px 12px; background:#0b1220; }
    .t-table{ font-size:22px; font-weight:900; }
    .t-badge{ font-size:12px; font-weight:800; padding:3px 9px; border-radius:999px; }
    .b-new{ background:#7f1d1d; color:#fecaca; }
    .b-cook{ background:#78350f; color:#fde68a; }
    .t-elapsed{ font-size:13px; font-weight:800; padding:3px 9px; border-radius:999px; }
    .e-ok{ background:#14532d; color:#bbf7d0; }
    .e-warn{ background:#78350f; color:#fde68a; }
    .e-late{ background:#7f1d1d; color:#fecaca; }
    .t-items{ padding:10px 12px; flex:1; }
    .t-item{ display:flex; align-items:baseline; justify-content:space-between; padding:6px 0; border-bottom:1px dashed #334155; }
    .t-item:last-child{ border-bottom:0; }
    .t-item .nm{ font-size:17px; font-weight:700; }
    .t-item .qty{ font-size:18px; font-weight:900; color:#fbbf24; margin-left:10px; white-space:nowrap; }
    .t-prepaid{ display:inline-block; background:#065f46; color:#d1fae5; font-size:11px; font-weight:800; padding:1px 8px; border-radius:999px; margin-top:4px; }
    .t-time{ font-size:11px; color:#94a3b8; padding:0 12px 8px; }
    .t-act{ padding:10px 12px; border-top:1px solid #334155; display:flex; gap:8px; }
    .act-btn{ flex:1; border:0; border-radius:10px; padding:13px 8px; font-size:15px; font-weight:900; cursor:pointer; font-family:inherit; color:#fff; }
    .act-cook{ background:#f59e0b; }
    .act-done{ background:#16a34a; }
    .act-back{ flex:0 0 46px; background:#334155; color:#cbd5e1; font-size:16px; }
    .kempty{ text-align:center; color:#64748b; padding:60px 20px; font-size:18px; font-weight:700; }
  </style>
</head>
<body>
  <div class="kds-head">
    <div class="kds-title">🍳 <span id="lblTitle" data-t="title">キッチン</span><span class="sub" id="lblSub" data-t="sub">未提供オーダー</span></div>
    <div class="actions">
      <button class="kbtn" data-tlang onclick="I18n.toggle()">EN</button>
      <button class="kbtn" onclick="location.href='./manage.html'" data-t="back">← 管理</button>
      <span class="kcount" id="kcount">0</span>
      <button class="kbtn on" id="soundBtn" onclick="toggleSound()">🔔 音 ON</button>
      <button class="kbtn" id="reloadBtn" onclick="reloadAll()">↻</button>
    </div>
  </div>
  <div id="staleWrap" style="display:none;background:#fffbeb;border-bottom:2px solid #fcd34d;padding:8px 14px;font-size:13px;color:#92400e;font-weight:800;"></div>
  <div class="kgrid" id="grid"><div class="kempty" id="loadMsg" data-t="loading">読み込み中…</div></div>

  <script src="./config.js"></script>
  <script src="./api.js"></script>
  <script src="./i18n.js"></script>
  <script>
    // [P0-2] 注文状態の変更はスタッフ操作のため、このKDS端末でも事前ログイン（1回のみ）を必須にする。
    var TOKEN = localStorage.getItem('mgmtToken') || '';
    if (!TOKEN) location.href = './manage.html';
    var soundOn = true, lastNewIds = {}, firstPaint = true;
    var KITCHEN_MAP = {}; // 商品名(基底名) -> true(キッチン表示)/false(非表示)。未取得/未登録の商品は常にtrue扱い（安全側）。

    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    // オプション付き商品名（例:「コーラ (氷なし)」）から基底の商品名を取り出す
    function baseName(nm){ return String(nm||'').replace(/\s*[（(][^（(]*[)）]\s*$/, '').trim(); }
    function parseItems(details){
      var items = String(details||'').split(',').map(function(seg){
        seg = seg.trim(); if(!seg) return null;
        var m = seg.match(/^(.*)x(\d+)$/);
        if (m) return { name:m[1], qty:parseInt(m[2],10)||1 };
        return { name:seg, qty:1 };
      }).filter(Boolean);
      // ドリンク等、キッチン対応不要に設定された商品はキッチン画面の明細から除外
      return items.filter(function(it){ return KITCHEN_MAP[baseName(it.name)] !== false; });
    }
    function loadMenu(){
      API.post('getMenu', {}).then(function(r){
        var list = (r && r.data) || [];
        var map = {};
        list.forEach(function(it){
          var v = it['厨房表示'];
          map[it['商品名']] = !(v === '0' || v === 0 || v === false);
        });
        KITCHEN_MAP = map;
      }).catch(function(){});
    }
    function elapsedInfo(dateStr){
      var mins = 0;
      try { mins = Math.max(0, Math.floor((Date.now() - new Date(dateStr).getTime())/60000)); } catch(e){}
      var cls = mins >= 12 ? 'e-late' : (mins >= 6 ? 'e-warn' : 'e-ok');
      return { mins:mins, cls:cls };
    }
    function fmtTime(dateStr){ try { return new Date(dateStr).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); } catch(e){ return ''; } }

    var lastData = [];
    function render(data){
      data = data || lastData || []; lastData = data;
      var active = data.filter(function(o){ return o.status === '未対応' || o.status === '調理中'; });
      // [P1-4] 長時間放置された古い注文（stale）は通常のチケット一覧から隔離し、別枠で表示する。
      var stale = active.filter(function(o){ return o.stale; });
      active = active.filter(function(o){ return !o.stale; });
      renderStale(stale);
      // キッチン非対象の商品のみで構成される注文はチケット自体を非表示にする
      active = active.map(function(o){ return { o:o, items: parseItems(o.details) }; }).filter(function(x){ return x.items.length > 0; });
      active.sort(function(a,b){ return new Date(a.o.date).getTime() - new Date(b.o.date).getTime(); });

      var curNew = {};
      active.forEach(function(x){ if(x.o.status==='未対応') curNew[x.o.id]=1; });
      if (!firstPaint && soundOn) { for (var id in curNew){ if(!lastNewIds[id]){ beep(); break; } } }
      lastNewIds = curNew; firstPaint = false;

      document.getElementById('kcount').innerText = active.length;
      if (!active.length){ document.getElementById('grid').innerHTML = '<div class="kempty">'+I18n.t('empty')+'</div>'; return; }


      var html = '';
      active.forEach(function(x){
        var o = x.o, items = x.items;
        var isNew = o.status === '未対応';
        var el = elapsedInfo(o.date);
        html += '<div class="ticket ' + (isNew?'new':'cook') + '">';
        html += '<div class="t-head"><div class="t-table">🪑 ' + esc(o.table) + '</div>'
             +  '<div style="display:flex;gap:6px;align-items:center;">'
             +  '<span class="t-badge ' + (isNew?'b-new':'b-cook') + '">' + (isNew?I18n.t('new'):I18n.t('cook')) + '</span>'
             +  '<span class="t-elapsed ' + el.cls + '">' + el.mins + I18n.t('min') + '</span></div></div>';
        html += '<div class="t-items">';
        items.forEach(function(it){ html += '<div class="t-item"><span class="nm">' + esc(it.name) + '</span><span class="qty">×' + it.qty + '</span></div>'; });
        if (o.paid) html += '<div class="t-prepaid">💳 '+I18n.t('prepaid')+'</div>';
        html += '</div>';
        html += '<div class="t-time">🕐 ' + fmtTime(o.date) + '</div>';
        html += '<div class="t-act">';
        if (isNew){ html += '<button class="act-btn act-cook" onclick="setStatus(\'' + o.id + '\',\'調理中\')">'+I18n.t('startCook')+'</button>'; }
        else {
          html += '<button class="act-back" onclick="setStatus(\'' + o.id + '\',\'未対応\')" title="'+I18n.t('backNew')+'">↩</button>';
          html += '<button class="act-btn act-done" onclick="setStatus(\'' + o.id + '\',\'提供済\')">'+I18n.t('done')+'</button>';
        }
        html += '</div></div>';
      });
      document.getElementById('grid').innerHTML = html;
    }

    // [P1-4] 滞留（12時間超・未対応/調理中のまま）の注文一覧をバナー表示。個別の会計/取消は注文管理(admin)側で行う。
    function renderStale(stale){
      var w = document.getElementById('staleWrap');
      if (!stale.length){ w.style.display='none'; w.innerHTML=''; return; }
      w.style.display='block';
      w.innerHTML = '⚠️ ' + stale.length + ' ' + I18n.t('staleNote') + '：' +
        stale.map(function(o){ return esc(o.table) + '(' + Math.floor((Date.now()-new Date(o.date).getTime())/60000) + 'm)'; }).join(', ');
    }
    window.setStatus = function(id, status){
      API.post('updateOrderStatus', { id: id, status: status, token: TOKEN }).then(function(){ load(true); }).catch(function(){ load(true); });
    };
    // [P0] getOrdersの単独ポーリングをやめ、getOperationsDelta（KDS/admin共通の統合API）を使う。
    // 直前に見たバージョン番号を送り、サーバー側で変化が無ければunchanged:trueだけが返るため、
    // 平常時（8秒ごと・変化なし）はSpreadsheet読込自体が省略され、GAS実行が軽くなる。
    var _opsVersion = null;
    var _loadInFlight = false;
    window.load = function(force){
      if (_loadInFlight) return; // 前回リクエストが残っていれば重複送信しない
      _loadInFlight = true;
      // [修正点一覧C-2対応] getOperationsDelta/getOrders/getStaffCallsが認証必須になったため、tokenを送る。
      var payload = (force || _opsVersion == null) ? { token: TOKEN } : { sinceVersion: _opsVersion, token: TOKEN };
      return API.post('getOperationsDelta', payload).then(function(r){
        _loadInFlight = false;
        __booted = true;
        var d = r.data || {};
        _opsVersion = d.version != null ? d.version : _opsVersion;
        if (d.unchanged) return; // 変化なし：再描画不要
        render(d.orders || []);
      }).catch(function(){
        _loadInFlight = false;
        var lm=document.getElementById('loadMsg'); if(lm) lm.innerText=I18n.t('connErr');
      });
    };

    var _actx = null;
    function beep(){
      try {
        _actx = _actx || new (window.AudioContext||window.webkitAudioContext)();
        var o = _actx.createOscillator(), g = _actx.createGain();
        o.type='sine'; o.frequency.value=880; o.connect(g); g.connect(_actx.destination);
        g.gain.setValueAtTime(0.001, _actx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.25, _actx.currentTime+0.02);
        g.gain.exponentialRampToValueAtTime(0.001, _actx.currentTime+0.35);
        o.start(); o.stop(_actx.currentTime+0.36);
      } catch(e){}
    }
    function updateSoundBtn(){ var b = document.getElementById('soundBtn'); b.className = 'kbtn' + (soundOn?' on':''); b.innerText = soundOn ? I18n.t('soundOn') : I18n.t('soundOff'); }
    window.toggleSound = function(){ soundOn = !soundOn; updateSoundBtn(); if (soundOn) beep(); };

    window.reloadAll = function(){ loadMenu(); load(true); };
    // [P0] タブが非表示（他アプリ切替・画面ロック等）の間はポーリング間隔を落とし、無駄なGAS実行を減らす。
    // 再表示時は即座に最新化する。
    var _pollTimer = null;
    function _pollInterval(){ return (document.visibilityState === 'hidden') ? 45000 : 8000; }
    function _resetPoll(){ if (_pollTimer) clearInterval(_pollTimer); _pollTimer = setInterval(load, _pollInterval()); }
    document.addEventListener('visibilitychange', function(){
      _resetPoll();
      if (document.visibilityState === 'visible') load(true);
    });
    function boot(){
      loadMenu();
      load();
      _resetPoll();   // 旧: 8秒/60秒の二重登録だった重複バグを解消（loadが2倍の頻度で呼ばれていた）
      setInterval(loadMenu, 300000); // メニュー設定（厨房表示ON/OFF）の変更を数分以内に反映
      // [慎重レビューH1対応] バージョン不一致検知に万一漏れがあっても数分以内に必ず復帰する安全弁として、
      // バージョンの一致・不一致に関わらず定期的に強制フルリフレッシュする。
      setInterval(function(){ load(true); }, 180000); // 3分ごと
      if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').catch(function(){}); }
    }
    var __booted = false;
    I18n.init({
      ja:{ title:'キッチン', sub:'未提供オーダー', back:'← 管理', loading:'読み込み中…', empty:'✅ 未提供のオーダーはありません', new:'新規', cook:'調理中', min:'分', prepaid:'前払い済', startCook:'🔥 調理開始', done:'✓ 提供完了', backNew:'新規に戻す', soundOn:'🔔 音 ON', soundOff:'🔕 音 OFF', connErr:'接続できません（自動再試行します）', staleNote:'件、長時間未処理の滞留注文があります（注文管理で確認してください）' },
      en:{ title:'Kitchen', sub:'Pending orders', back:'← Manage', loading:'Loading…', empty:'✅ No pending orders', new:'New', cook:'Cooking', min:'m', prepaid:'Prepaid', startCook:'🔥 Start', done:'✓ Served', backNew:'Back to new', soundOn:'🔔 Sound ON', soundOff:'🔕 Sound OFF', connErr:'Cannot connect (auto-retrying)', staleNote:'stale order(s) pending too long — please check in Orders' }
    }, function(){ updateSoundBtn(); if(__booted) render(lastData); });
    document.addEventListener('DOMContentLoaded', boot);
  </script>
</body>
</html>
