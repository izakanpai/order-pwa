<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Order</title>
</head>
<body>
  <div class="appbar">
    <div class="title" id="shopName">Order</div>
    <div class="clock" id="appbarClock"></div>
    <div class="table-chip" id="tableChip">Table —</div>
    <a class="lang-btn" id="mgmtBackBtn" href="./manage.html" style="display:none;">← 管理</a>
    <button class="lang-btn" id="langBtn" data-tlang>JP</button>
  </div>
  <div class="quickbar" id="quickbar">
    <button class="qbtn" id="memberBtn" style="display:none;"><span class="ico">🎁</span><span class="lbl" id="memberLbl"></span></button>
    <button class="qbtn" id="couponBtn"><span class="ico">🎟️</span><span class="lbl" id="couponLbl"></span></button>
    <button class="qbtn" id="callBtn"><span class="ico">🔔</span><span class="lbl" id="callLbl"></span></button>
    <button class="qbtn" id="billBtn"><span class="ico">🧾</span><span class="lbl" id="billLbl"></span></button>
    <button class="qbtn" id="statusBtn"><span class="ico">📋</span><span class="lbl" id="statusLbl"></span></button>
    <button class="qbtn" id="fbBtn"><span class="ico">⭐</span><span class="lbl" id="fbLbl"></span></button>
  </div>

  <div class="net-banner offline-b" id="offlineBanner">
    <span>📴</span><span id="offlineText">Offline — orders will be sent automatically when back online</span>
  </div>

  <img id="shopBanner" class="shop-banner" alt="" style="display:none;">


  <div class="vat-notice" id="vatNotice" style="display:none;"></div>

  <div class="cats" id="cats"></div>

  <div id="menuArea">
    <div class="loading"><span class="spinner"></span></div>
  </div>

  <div class="cartbar">
    <div class="row">
      <div class="tot">
        <div class="lbl" id="totalLbl">Total</div>
        <div class="val" id="totalVal">—</div>
        <div class="sub" id="totalSub"></div>
      </div>
      <button class="btn-send" id="sendBtn" disabled>
        <span id="sendLbl">Order</span>
        <span class="pending-pill" id="pendingPill">0</span>
      </button>
    </div>
  </div>

  <!-- Success -->
  <div class="overlay" id="okOverlay">
    <div class="sheet">
      <div class="emoji" id="okEmoji">✅</div>
      <h3 id="okTitle">Order sent</h3>
      <p id="okMsg"></p>
      <button class="btn-send ok" id="okBtn">OK</button>
    </div>
  </div>

  <!-- Error -->
  <div class="overlay" id="errOverlay">
    <div class="sheet">
      <div class="emoji">⚠️</div>
      <h3 id="errTitle">Error</h3>
      <p id="errMsg"></p>
      <button class="btn-send ok" id="errBtn" style="background:var(--red);">OK</button>
    </div>
  </div>

  <!-- Session ended (checkout completed on this table) — full-screen lock -->
  <div class="overlay" id="doneOverlay" style="z-index:999999;">
    <div class="sheet">
      <div class="emoji">🙏</div>
      <h3 id="doneTitle">Thank you!</h3>
      <p id="doneMsg"></p>
    </div>
  </div>

  <!-- Table picker + party size (headcount), combined into a single step.
       [応答速度対応] 以前は「卓選択」→（サーバへ既存人数を確認）→「人数入力」→（サーバへ保存）の
       2画面・2回の逐次サーバ往復だった。卓選択と人数入力を同じ画面にまとめ、既存人数の事前確認は
       行わず、送信は1回（人数機能を使わない店舗では0回）にすることで体感速度を上げる。
       tableSelectWrap: ?table=なし（店員のオーダー入力）でのみ表示。partySection: 入場料/延長料の
       設定（entryFeeAmount/extensionFeeAmount）がどちらも0の店舗では丸ごと非表示・サーバ往復なし。 -->
  <div class="overlay" id="tableOverlay">
    <div class="sheet">
      <div class="emoji">🪑</div>
      <h3 id="tblTitle">Select your table</h3>
      <p id="tblMsg"></p>
      <div id="tableSelectWrap">
        <select id="tableSelect" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);font-size:16px;margin:14px 0;background:#fff;"></select>
      </div>
      <div id="partySection" style="display:none;">
        <label id="partyLabel" style="display:block;font-size:13px;font-weight:800;margin:10px 0 4px;text-align:left;">Guests</label>
        <input type="number" id="partyCount" min="1" max="99" step="1" inputmode="numeric" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);font-size:16px;margin:0 0 6px;background:#fff;text-align:center;">
        <p id="partyMsg" style="font-size:12px;margin:0 0 8px;"></p>
      </div>
      <button class="btn-send ok" id="tblGo" style="width:100%;">Start</button>
    </div>
  </div>

  <!-- Member / loyalty -->
  <div class="overlay" id="memberModal">
    <div class="sheet">
      <div class="emoji">🎁</div>
      <h3 id="memTitle">Member</h3>
      <p id="memSub" style="font-size:13px;color:var(--text-2);"></p>
      <input type="tel" id="memPhone" placeholder="09xx xxx xxxx" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);font-size:16px;margin:10px 0;box-sizing:border-box;">
      <button class="btn-send ok" id="memLookup" style="width:100%;">Check</button>
      <div id="memInfo" style="margin-top:12px;display:none;">
        <div id="memName" style="font-weight:800;"></div>
        <div id="memPoints" style="font-size:22px;font-weight:900;color:var(--accent);"></div>
        <label style="display:flex;align-items:center;gap:8px;margin-top:10px;justify-content:center;"><input type="checkbox" id="memUse" style="width:20px;height:20px;"><span id="memUseLabel">Use points</span></label>
        <div style="margin-top:12px;border-top:1px solid var(--border);padding-top:10px;">
          <div id="memBdayLbl" style="font-size:12px;color:var(--text-2);margin-bottom:6px;">🎂 Register your birthday for a treat</div>
          <div style="display:flex;gap:8px;">
            <input type="text" id="memBday" inputmode="numeric" placeholder="MM-DD" maxlength="5" style="flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);font-size:16px;box-sizing:border-box;">
            <button class="btn-send ok" id="memBdaySave" style="width:auto;padding:0 16px;">Save</button>
          </div>
          <div id="memBdayMsg" style="font-size:12px;margin-top:6px;font-weight:700;"></div>
        </div>
      </div>
      <button id="memClose" style="width:100%;margin-top:10px;background:#f1f5f9;color:#475569;border:none;padding:12px;border-radius:12px;font-weight:700;cursor:pointer;">Close</button>
    </div>
  </div>

  <!-- Coupon / voucher -->
  <div class="overlay" id="couponModal">
    <div class="sheet">
      <div class="emoji">🎟️</div>
      <h3 id="cpTitle">Coupon</h3>
      <p id="cpSub" style="font-size:13px;color:var(--text-2);"></p>
      <input type="text" id="cpCode" placeholder="CODE" autocapitalize="characters" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);font-size:16px;margin:10px 0;box-sizing:border-box;text-transform:uppercase;">
      <button class="btn-send ok" id="cpApply" style="width:100%;">Apply</button>
      <div id="cpMsg" style="margin-top:10px;font-size:14px;font-weight:700;"></div>
      <button id="cpRemove" style="width:100%;margin-top:10px;background:#fee2e2;color:#b91c1c;border:none;padding:12px;border-radius:12px;font-weight:700;cursor:pointer;display:none;">Remove coupon</button>
      <button id="cpClose" style="width:100%;margin-top:10px;background:#f1f5f9;color:#475569;border:none;padding:12px;border-radius:12px;font-weight:700;cursor:pointer;">Close</button>
    </div>
  </div>

  <!-- My orders / status -->
  <div class="overlay" id="statusModal">
    <div class="sheet" style="max-height:80vh;overflow:auto;text-align:left;">
      <div class="emoji" style="text-align:center;">📋</div>
      <h3 id="stTitle" style="text-align:center;">My orders</h3>
      <div id="stBody" style="margin:8px 0;"></div>
      <div id="stSubRow" style="display:flex;justify-content:space-between;font-size:14px;color:var(--text-2);padding-top:6px;">
        <span id="stSubLbl">Subtotal</span><span id="stSubVal">—</span>
      </div>
      <div id="stSvcRow" style="display:none;justify-content:space-between;font-size:14px;color:var(--text-2);">
        <span id="stSvcLbl">Service</span><span id="stSvcVal">—</span>
      </div>
      <div id="stTotalRow" style="display:flex;justify-content:space-between;font-weight:900;font-size:17px;border-top:2px solid var(--border);padding-top:10px;margin-top:6px;">
        <span id="stTotalLbl">Unpaid total</span><span id="stTotalVal">—</span>
      </div>
      <button class="btn-send ok" id="stRefresh" style="width:100%;margin-top:12px;">Refresh</button>
      <button id="stClose" style="width:100%;margin-top:10px;background:#f1f5f9;color:#475569;border:none;padding:12px;border-radius:12px;font-weight:700;cursor:pointer;">Close</button>
    </div>
  </div>

  <!-- Feedback -->
  <div class="overlay" id="fbModal">
    <div class="sheet">
      <div class="emoji">⭐</div>
      <h3 id="fbTitle">How was it?</h3>
      <p id="fbSub" style="font-size:13px;color:var(--text-2);"></p>
      <div id="fbStars" style="font-size:38px;letter-spacing:6px;margin:8px 0;user-select:none;">
        <span data-v="1" style="cursor:pointer;">☆</span><span data-v="2" style="cursor:pointer;">☆</span><span data-v="3" style="cursor:pointer;">☆</span><span data-v="4" style="cursor:pointer;">☆</span><span data-v="5" style="cursor:pointer;">☆</span>
      </div>
      <textarea id="fbComment" rows="3" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);font-size:15px;box-sizing:border-box;font-family:inherit;"></textarea>
      <button class="btn-send ok" id="fbSend" style="width:100%;margin-top:10px;">Send</button>
      <button id="fbClose" style="width:100%;margin-top:10px;background:#f1f5f9;color:#475569;border:none;padding:12px;border-radius:12px;font-weight:700;cursor:pointer;">Close</button>
    </div>
  </div>

  <!-- Options / variations -->
  <div class="overlay" id="optModal">
    <div class="sheet" style="text-align:left;max-height:82vh;overflow:auto;">
      <h3 id="optName" style="text-align:center;margin:4px 0 12px;"></h3>
      <div id="optBody"></div>
      <button class="btn-send ok" id="optAdd" style="width:100%;margin-top:14px;">Add to order</button>
      <button id="optClose" style="width:100%;margin-top:10px;background:#f1f5f9;color:#475569;border:none;padding:12px;border-radius:12px;font-weight:700;cursor:pointer;">Close</button>
    </div>
  </div>

  <style>
    .opt-btn{width:100%;background:var(--accent);color:#fff;border:none;padding:10px;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
    .opt-badge{background:#fff;color:var(--accent);border-radius:999px;min-width:20px;height:20px;line-height:20px;text-align:center;font-size:12px;font-weight:900;padding:0 6px;}
    .opt-group{margin:12px 0;padding-bottom:8px;border-bottom:1px solid var(--border);}
    .opt-gname{font-weight:800;margin-bottom:6px;}
    .opt-req{color:var(--red);font-size:12px;font-weight:700;}
    .opt-choice{display:flex;align-items:center;gap:10px;padding:8px 4px;font-size:15px;cursor:pointer;}
    .opt-choice input{width:20px;height:20px;flex:none;}
    .opt-qtybar{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:14px;font-weight:800;}
    .opt-qtybar button{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:20px;font-weight:900;cursor:pointer;}
    .opt-incart{background:#f8fafc;border-radius:10px;padding:8px 10px;margin-bottom:8px;}
    .opt-incart-h{font-size:12px;font-weight:800;color:var(--text-2);margin-bottom:4px;}
    .opt-line{display:flex;align-items:center;justify-content:space-between;font-size:14px;padding:3px 0;}
    .opt-rm{background:#fee2e2;color:#b91c1c;border:none;border-radius:8px;width:26px;height:26px;font-weight:900;cursor:pointer;}
    .card.unavail{opacity:.55;}
    .card.unavail .thumb,.card.unavail .no-thumb{filter:grayscale(1);}
    .unavail-tag{display:inline-block;background:#e2e8f0;color:#64748b;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:800;}
    .tags{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 4px;}
    .tag-spicy{font-size:12px;}
    .tag-allg{font-size:11px;background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;border-radius:6px;padding:1px 5px;font-weight:700;}
  </style>

  <script src="./config.js"></script>
  <script src="./api.js"></script>
  <script src="./i18n.js"></script>
  <script src="./confirm.js"></script>
  <script src="./app.js"></script>
  <script src="./help.js"></script>
  <script>
    HelpUI.register({
      title: 'ご注文画面の使い方',
      titleEn: 'How to order',
      items: [
        { ja: '① 上部のカテゴリタブでメニューを絞り込み、商品の＋ボタンでカートに追加します（オプションがある商品は選択画面が開きます）。', en: '① Use the category tabs to filter the menu, then tap + to add an item to your cart (items with options open a choice screen first).' },
        { ja: '② 画面下の「注文」ボタンでカート内容を送信します。件数バッジで未送信の点数を確認できます。', en: '② Tap the Order button at the bottom to send your cart. The badge shows how many items are pending.' },
        { ja: '③ クイックバーの🎁会員／🎟️クーポンで、会員証確認・ポイント利用・誕生日登録やクーポンコードの適用ができます。', en: '③ Use the 🎁 Member and 🎟️ Coupon buttons in the quick bar to check membership, use points, register a birthday, or apply a coupon code.' },
        { ja: '④ 🔔スタッフ呼出でスタッフを呼び、🧾お会計でお支払い方法（会計時に精算／GCash／カード）を選べます。', en: '④ Use 🔔 to call staff, and 🧾 to choose how to pay (pay at counter / GCash / card).' },
        { ja: '⑤ 📋注文状況でこれまで注文した内容・小計・未払い合計を確認できます。', en: '⑤ Use 📋 to see your order history, subtotal, and unpaid total.' },
        { ja: '⑥ ⭐評価ボタンから星評価とコメントを送信できます。', en: '⑥ Use ⭐ to send a star rating and comment.' },
        { ja: '⑦ 卓を選ばずにアクセスした場合は、最初に卓番号（と人数）を選ぶ画面が表示されます。', en: '⑦ If you open this without a table pre-selected, you will first be asked to choose your table (and party size).' }
      ]
    });
  </script>
</body>
</html>
